<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MacroLog">
<meta name="theme-color" content="#0B0B0D">
<title>MacroLog</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500;1,9..144,650&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   MacroLog — same editorial design language as IronLog:
   charcoal/bronze/cream, dark-mode-first, floating pill nav.
   Type pairing: Fraunces (display serif) + system sans for
   body & numbers (tabular-nums for the big scannable figures).
   ============================================================ */
:root{
  --bg:#0B0B0D; --bgtop:#17181D; --card:#151518; --card2:#1F1F24; --line:#28282E;
  --text:#F5F3EE; --dim:#94948E;
  --acc:#C9A96D; --acc2:#E8CFA0; --acc-dim:rgba(201,169,109,.15);
  --chrome:#F2EFE7; --chrome-text:#16171B;      /* inverse buttons/chips */
  --navbg:#1A1B20; --navfg:#8D8D94; --navon:#FFFFFF;
  --hdr:rgba(23,24,29,.85);         /* v3.3: --bgtop, not --bg — the old value seamed */
  --grn:#2fd671; --grn-dim:rgba(47,214,113,.12);
  --amb:#f5b62e; --red:#ff5c5c; --gold:#ffcf4d;
  /* macro identity colours (consistent across rings, charts, chips) */
  --mp:#5FA8FF; --mp2:#9CCBFF;   /* protein  */
  --mc:#F5B62E; --mc2:#FFD770;   /* carbs    */
  --mf:#B07AFF; --mf2:#D5B3FF;   /* fat      */
  --shadow:0 8px 24px rgba(0,0,0,.32);
  --nav-h:62px;
}
body.light{
  --bg:#ECEAE3; --bgtop:#F4F2EB; --card:#FFFFFF; --card2:#F0EEE6; --line:#E3E0D6;
  --text:#1A1B1E; --dim:#85847C;
  --acc:#A9884D; --acc2:#C9A96D; --acc-dim:rgba(169,136,77,.14);
  --chrome:#1D1E24; --chrome-text:#F5F3EE;
  --navbg:#FFFFFF; --navfg:#8B8A81; --navon:#17181B;
  --hdr:rgba(244,242,235,.88);
  --grn-dim:rgba(47,214,113,.16);
  --mp:#2E7FE0; --mc:#D89A10; --mf:#9257E8;
  --shadow:0 10px 26px rgba(35,32,26,.10);
}
*{box-sizing:border-box}
/* iOS inflates some text after a landscape→portrait rotation ("text
   autosizing"); pinning text-size-adjust stops the drift */
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;touch-action:manipulation;
  /* App shell pinned to the viewport EDGES, not sized by height units:
     100dvh and window.innerHeight both misreport in iOS home-screen mode
     (status-bar / home-indicator bands). position:fixed + inset:0 needs no
     height math — the shell always spans the real viewport. DO NOT regress
     to dvh/innerHeight (IronLog field finding, confirmed on iPhone 17). */
  position:fixed;inset:0;
  overflow:hidden;
  display:flex;flex-direction:column;
}
body{background:linear-gradient(180deg,var(--bgtop) 0%,var(--bg) 320px) no-repeat,var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;touch-action:manipulation;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Fraunces',ui-serif,'New York',Georgia,serif}

/* ---------- header ---------- */
header{
  flex:0 0 auto;z-index:30;position:relative;
  padding:env(safe-area-inset-top) 16px 0;
  background:var(--hdr);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
/* v3.3 — iOS 27 "blurry top of screen": the status-bar band is painted OPAQUE
   instead of frosted. Two treatments stack in that band on a black-translucent
   home-screen app: iOS 26+ lays its own glass over the top of the web view, and
   our backdrop-filter blurs the same region from below — and because a backdrop
   blur clamps its sampling at the viewport edge, the topmost row of pixels is
   smeared downwards. It reads as a permanently out-of-focus strip across the
   top. Painting the band in the exact colour the blur resolves to (--bgtop,
   which --hdr is now 85% of) removes the double treatment with no visible seam,
   and stops page content ghosting through the status bar as it scrolls. The bar
   below keeps its frost. Height is the top inset, so it is a no-op where that
   reads 0 (browser tabs, and Android, which insets the viewport itself). */
header::before{
  content:'';position:absolute;left:0;right:0;top:0;height:env(safe-area-inset-top);
  background:var(--bgtop);pointer-events:none;
}
.hbar{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 6px}
.greet{font-family:'Fraunces',ui-serif,Georgia,serif;font-size:22px;font-weight:650;letter-spacing:-.2px;line-height:1.15}
.greet .nm{font-style:italic;color:var(--acc)}
.hsub{font-size:12.5px;color:var(--dim);margin-top:1px}
.netchip{
  display:none;align-items:center;gap:6px;flex:0 0 auto;
  font-size:11.5px;font-weight:700;color:var(--amb);
  background:rgba(245,182,46,.13);border-radius:999px;padding:5px 10px;
}
body.off .netchip{display:flex}
.netchip::before{content:'';width:7px;height:7px;border-radius:4px;background:var(--amb)}

/* ---------- main / pages ---------- */
main{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:10px 13px 40px;
}
.page{display:none}
.page.active{display:block}

/* ---------- bottom nav (floating pill, centre Add raised) ---------- */
nav{
  flex:0 0 auto;z-index:35;display:flex;align-items:center;
  margin:6px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--navbg);border-radius:24px;padding:4px 6px;
  box-shadow:var(--shadow);
}
body.vfix nav{margin-bottom:max(env(safe-area-inset-bottom),24px)}
nav button{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--navfg);position:relative;border-radius:18px}
nav button.on{color:var(--navon)}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button span{font-size:10px;font-weight:600;letter-spacing:.2px}
nav button.nav-add{flex:0 0 62px}
.nav-add i{
  display:flex;align-items:center;justify-content:center;
  width:50px;height:50px;border-radius:17px;background:var(--acc);color:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,.35);transform:translateY(-8px);
  transition:transform .15s;
}
.nav-add:active i{transform:translateY(-8px) scale(.93)}
.nav-add i svg{width:26px;height:26px;stroke:#fff;stroke-width:2.2}

/* ---------- cards / common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px}
.card h3.serif{font-family:'Fraunces',ui-serif,Georgia,serif;font-size:16.5px;font-weight:650}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.dim{color:var(--dim)}
.small{font-size:13px}
.tiny{font-size:11px}
.bold{font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;border-radius:14px;font-size:17px;font-weight:700;
  background:var(--card2);color:var(--text);
}
.btn:active{filter:brightness(1.2)}
body.light .btn:active{filter:brightness(.94)}
.btn.primary{background:var(--acc);color:#fff}
.btn.chrome{background:var(--chrome);color:var(--chrome-text)}
.btn.green{background:var(--grn);color:#04170b}
.btn.danger{background:rgba(255,92,92,.14);color:var(--red)}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px}
.btn.inline{width:auto;padding:0 16px}

.in{
  width:100%;background:var(--card2);border:1px solid transparent;border-radius:12px;
  color:var(--text);font-size:17px;padding:12px;outline:none;-webkit-appearance:none;appearance:none;
}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.4px;text-transform:uppercase;margin:12px 2px 6px}
.lbl:first-child{margin-top:0}

.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg>button{flex:1;min-height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--dim)}
.seg>button.on{background:var(--acc);color:#fff}

input.range{flex:1;accent-color:var(--acc);height:34px;margin:0}

/* ---------- sheets / overlay / toasts ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
  opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;
}
.overlay.open{opacity:1}
.sheet{
  width:100%;max-height:88%;display:flex;flex-direction:column;
  background:var(--bg);border-radius:24px 24px 0 0;
  padding:8px 16px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(60px);transition:transform .22s cubic-bezier(.2,.9,.3,1);
}
.overlay.open .sheet{transform:translateY(0)}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex:0 0 auto}
.sheet-head h2{font-family:'Fraunces',ui-serif,Georgia,serif;font-size:20px;font-weight:650}
.sheet-x{width:36px;height:36px;border-radius:12px;background:var(--card2);color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  max-width:86%;background:var(--chrome);color:var(--chrome-text);
  font-size:14.5px;font-weight:600;border-radius:14px;padding:11px 18px;
  box-shadow:var(--shadow);opacity:0;transform:translateY(-12px);transition:all .25s;
}
.toast.in{opacity:1;transform:translateY(0)}
.toast.pr{background:var(--acc);color:#fff}
</style>
<style>
/* ---------- Today: hero rings ---------- */
.hero{position:relative;overflow:hidden;padding:18px 14px}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.85;transition:opacity .6s}
.hero.star #fx{opacity:1}
.hero-in{position:relative;display:flex;align-items:center;gap:6px}
.ringwrap{flex:0 0 186px;width:186px;height:186px;position:relative}
/* overflow:visible — the met-state glow blurs past the SVG bounds; the
   default hidden overflow clipped it into a harsh square fade */
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-track{fill:none;stroke:var(--card2);opacity:.85}
.ring-arc{
  fill:none;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset .9s cubic-bezier(.25,.8,.3,1);
}
.ring-arc.rk{filter:drop-shadow(0 0 5px var(--acc))}
.ring-arc.rp{filter:drop-shadow(0 0 4px var(--mp))}
.ring-arc.rc{filter:drop-shadow(0 0 4px var(--mc))}
.ring-arc.rf{filter:drop-shadow(0 0 4px var(--mf))}
/* goal met → the ring glows noticeably brighter (static filter — animating
   SVG filters janks on iOS; motion comes from the hero canvas sparkles) */
.ring-arc.rk.met{filter:drop-shadow(0 0 5px var(--acc)) drop-shadow(0 0 13px var(--acc))}
.ring-arc.rp.met{filter:drop-shadow(0 0 4px var(--mp)) drop-shadow(0 0 11px var(--mp))}
.ring-arc.rc.met{filter:drop-shadow(0 0 4px var(--mc)) drop-shadow(0 0 11px var(--mc))}
.ring-arc.rf.met{filter:drop-shadow(0 0 4px var(--mf)) drop-shadow(0 0 11px var(--mf))}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ringmid .rk-n{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1}
/* the innermost ring leaves ~52px of clear width — 4+ digit kcal counts
   must shrink to stay inside it (1,000+ kcal is the NORMAL case) */
.ringmid .rk-n.d4{font-size:19px;letter-spacing:-.4px}
.ringmid .rk-n.d5{font-size:16px;letter-spacing:-.3px}
.ringmid .rk-l{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.ringstats{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;padding-left:4px}
.rstat{display:flex;align-items:center;gap:8px}
.rdot{width:9px;height:9px;border-radius:5px;flex:0 0 auto}
.rstat .rl{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.3px;text-transform:uppercase}
.rstat .rv{font-size:16.5px;font-weight:800;letter-spacing:-.2px}
.rstat .rv .of{font-size:12px;font-weight:600;color:var(--dim)}
.rstat .rv.over{color:var(--amb)}
/* goal met → stat value takes its macro colour and glows (--metc is set
   per row when the stat is built) */
.rstat .rv.met{color:var(--metc,var(--gold));text-shadow:0 0 11px var(--metc,var(--gold))}
.remain{position:relative;text-align:center;margin-top:12px;font-size:13.5px;color:var(--dim)}
.remain b{color:var(--text);font-weight:800}
.remain.over b{color:var(--amb)}

/* ---------- meal groups & swipeable food rows ---------- */
.mealgrp{margin-bottom:12px}
.mealhead{display:flex;align-items:baseline;gap:8px;padding:2px 4px 8px}
.mealhead h3{font-family:'Fraunces',ui-serif,Georgia,serif;font-size:17.5px;font-weight:650}
.mealhead .mk{font-size:12.5px;color:var(--dim);font-weight:600}
.madd{
  margin-left:auto;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--acc-dim);color:var(--acc);font-size:19px;font-weight:700;line-height:1;
}
/* The note pencil belongs WITH the kcal figure, not floating mid-row.
   Two flex items both carrying margin-left:auto split the free space
   between them, which is what parked it in the middle — so the pencil
   opts out and only the + button pushes to the right edge. */
.madd.pen{margin-left:0;width:30px;height:30px;font-size:14px;background:none;align-self:center}
.madd.pen:active{background:var(--acc-dim)}
.mealcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fr-row{position:relative;overflow:hidden;touch-action:pan-y}
.fr-row + .fr-row{border-top:1px solid var(--line)}
.fr-acts{position:absolute;inset:0 0 0 auto;display:flex;width:132px}
.fr-acts button{flex:1;font-size:12.5px;font-weight:700;color:#fff}
.fr-acts .fa-e{background:#3f6ea5}
.fr-acts .fa-d{background:#a53f3f}
.fr-slide{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:var(--card);
  transition:transform .18s ease-out;
}
.fr-slide.drag{transition:none}
.fr-thumb{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;overflow:hidden;
  background:var(--acc-dim);color:var(--acc);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',ui-serif,Georgia,serif;font-size:17px;font-weight:650;
}
.fr-thumb img{width:100%;height:100%;object-fit:cover}
.fr-name{font-size:15px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-sub{font-size:12px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-kcal{text-align:right;flex:0 0 54px}  /* fixed width → grade badges align */
.note-line{font-size:12.5px;color:var(--acc);background:var(--acc-dim);padding:8px 12px;line-height:1.4}
.mealcard .note-line{border-bottom:1px solid var(--line)}
.daynote{display:block;width:100%;text-align:left;border-radius:14px;margin-bottom:10px}
.fr-kcal b{font-size:15px;font-weight:800}
.fr-kcal span{display:block;font-size:10.5px;color:var(--dim)}
.mealempty{padding:13px 14px;font-size:13.5px;color:var(--dim)}
.mealempty i{font-family:'Fraunces',ui-serif,Georgia,serif;font-style:italic}

/* macro mini-chips under a food name */
.mch{display:inline-flex;gap:7px;font-size:11px;font-weight:700;color:var(--dim)}
.mch b{font-weight:800}
.mch .p b{color:var(--mp)}.mch .c b{color:var(--mc)}.mch .f b{color:var(--mf)}

/* ---------- Add tab ---------- */
.searchwrap{display:flex;gap:8px;margin-bottom:12px}
.searchwrap .in{flex:1;border-radius:14px;padding:13px 14px;font-size:16.5px}
.scanbtn{
  flex:0 0 54px;border-radius:14px;background:var(--chrome);color:var(--chrome-text);
  display:flex;align-items:center;justify-content:center;
}
.scanbtn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.addsec{margin:16px 2px 8px;display:flex;align-items:baseline;justify-content:space-between}
.addsec h4{font-family:'Fraunces',ui-serif,Georgia,serif;font-size:16px;font-weight:650}
.addsec span{font-size:12px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:8px 13px;font-size:13.5px;font-weight:600;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chip:active{background:var(--acc-dim)}
.chip b{color:var(--acc);font-weight:800;margin-right:5px}
.listcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.food-row{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;text-align:left}
.food-row + .food-row{border-top:1px solid var(--line)}
.food-row:active{background:var(--card2)}
.src-tag{font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:6px;background:var(--card2);color:var(--dim);flex:0 0 auto}
.src-tag.off{background:rgba(95,168,255,.13);color:var(--mp)}
.src-tag.fdc{background:rgba(47,214,113,.13);color:var(--grn)}
.src-tag.mine{background:var(--acc-dim);color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:20px;height:20px}
.skel{height:58px;position:relative;overflow:hidden;background:var(--card)}
.skel + .skel{border-top:1px solid var(--line)}
.skel::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--card2),transparent);
  animation:shimmer 1.1s infinite;
}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.searchmsg{padding:18px 14px;text-align:center;font-size:13.5px;color:var(--dim)}
.searchmsg .serif{font-size:15.5px;font-style:italic;margin-bottom:4px;color:var(--text)}

/* stepper (qty) */
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:13px;background:var(--card2);font-size:22px;font-weight:700;color:var(--acc)}
.stepper input{flex:1;text-align:center;font-size:22px;font-weight:800;background:none;border:0;outline:none;min-width:0;color:var(--text)}

/* ---------- barcode scanner overlay ---------- */
#scanov{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column}
#scanov.open{display:flex}
#scanvid{flex:1;width:100%;object-fit:cover;min-height:0}
.scanbox{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  width:78%;height:150px;border-radius:18px;
  box-shadow:0 0 0 2000px rgba(0,0,0,.45);
  border:2.5px solid rgba(255,255,255,.9);
}
.scanbox::after{
  content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;
  background:var(--red);opacity:.8;box-shadow:0 0 8px var(--red);
  animation:scanline 1.6s ease-in-out infinite alternate;
}
@keyframes scanline{from{transform:translateY(-46px)}to{transform:translateY(46px)}}
.scanhint{position:absolute;left:0;right:0;top:calc(38% + 95px);text-align:center;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 4px #000}
.scanfoot{flex:0 0 auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:#000}

/* ---------- Diary ---------- */
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dchev{width:44px;height:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:17px}

  flex:1;position:relative;height:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Fraunces',ui-serif,Georgia,serif;font-size:16px;font-weight:650;
}
.dlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.dtoday{flex:0 0 auto;height:44px;padding:0 13px;border-radius:13px;background:var(--acc-dim);color:var(--acc);font-size:13px;font-weight:700}

  display:flex;align-items:center;gap:9px;margin-bottom:10px;
  background:rgba(245,182,46,.11);border:1px solid rgba(245,182,46,.35);
  border-radius:14px;padding:10px 13px;font-size:12.5px;color:var(--amb);font-weight:600;
}
.daysum{display:flex;gap:8px;margin-bottom:12px}
.daysum .ds{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center}
.daysum .ds b{display:block;font-size:16px;font-weight:800;letter-spacing:-.2px}
.daysum .ds span{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.daysum .ds u{display:block;text-decoration:none;font-size:10px;color:var(--dim);margin-top:1px}
/* goal met → gold-rimmed tile with a twinkling sparkle */
.daysum .ds.met{border-color:rgba(255,207,77,.55);box-shadow:0 0 15px rgba(255,207,77,.20),inset 0 0 12px rgba(255,207,77,.06);position:relative;overflow:visible}
.daysum .ds.met b{color:var(--gold);text-shadow:0 0 10px rgba(255,207,77,.4)}
.daysum .ds.met::after{content:'✨';position:absolute;top:-8px;right:-3px;font-size:12px;animation:sparkle 1.9s ease-in-out infinite}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0deg);opacity:.85}50%{transform:scale(1.3) rotate(14deg);opacity:1}}
body.light .daysum .ds.met b{color:#b8860b;text-shadow:0 0 8px rgba(184,134,11,.3)}

/* ---------- Progress ---------- */
.rangebar{margin-bottom:12px}
.chartwrap{position:relative;width:100%}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pstat{background:var(--card2);border-radius:14px;padding:11px 12px}
.pstat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.3px}
.pstat b small{font-size:12px;font-weight:700;color:var(--dim)}
.pstat span{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.streakfire{color:var(--acc)}

/* ---------- Settings ---------- */
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:16px;border:2.5px solid transparent;position:relative}
.swatch.on{border-color:var(--text)}
.swatch.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.setrow{display:flex;align-items:center;gap:10px;min-height:46px}
.setrow + .setrow{border-top:1px solid var(--line)}

/* ---------- v3.3: data-safety panel ---------- */
.ds-pill{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:4px 10px;border-radius:9px;background:var(--card2);color:var(--dim)}
.ds-pill.good{background:var(--grn-dim);color:var(--grn)}
.ds-pill.bad{background:rgba(245,182,46,.16);color:var(--amb)}
.warn-t{color:var(--amb)}
/* Light mode needs its own hues here. The semantic tokens (--grn/--amb/--red/
   --gold) are dark-theme neon and body.light has never redefined them, so on the
   white card this panel measured 1.64:1 (At risk), 1.71:1 (Protected) and 1.81:1
   (the stale-backup line) — and because the line swaps `dim` for `warn-t` to
   escalate, the WARNING state came out less legible than the calm one (3.76:1),
   which is exactly backwards for the one sentence that says how old the only
   copy of the data is. These two are IronLog v5.7's measured light hues, which
   clear 4.5:1 on a white card. Scoped to this panel deliberately: the same gap
   affects .netchip, .btn.danger and the met-state gold elsewhere in light mode,
   but fixing those wholesale also needs companion rules (IronLog needed
   `body.light .btn.green{color:#fff}` once --grn went dark) — a separate job. */
body.light .ds-pill.good{background:rgba(9,99,49,.12);color:#096331}
body.light .ds-pill.bad{background:rgba(138,96,8,.14);color:#8A6008}
body.light .warn-t{color:#8A6008}
body.light .nag{border-color:#8A6008}
/* the backup nag: a card, not a toast — it must still be there tomorrow */
.nag{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--amb);
  border-radius:16px;padding:12px 13px;margin-bottom:12px}
.nag-i{flex:0 0 auto;font-size:19px;line-height:1}
.nag-t{font-size:13.5px;font-weight:700;line-height:1.35}
.nag-s{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.nag-go{flex:0 0 auto;background:var(--chrome);color:var(--chrome-text);font-size:12px;font-weight:800;
  padding:9px 13px;border-radius:11px;min-height:40px;display:flex;align-items:center}
.nag-x{flex:0 0 auto;width:36px;height:36px;border-radius:9px;color:var(--dim);font-size:13px;
  display:flex;align-items:center;justify-content:center}

/* ---------- onboarding ---------- */
#ob{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 30px) 22px calc(env(safe-area-inset-bottom) + 22px);overflow-y:auto}
#ob.open{display:flex}
.ob-kicker{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.ob-title{font-family:'Fraunces',ui-serif,Georgia,serif;font-size:34px;font-weight:650;line-height:1.12;letter-spacing:-.5px;margin-bottom:8px}
.ob-title i{color:var(--acc)}
.ob-sub{font-size:15px;color:var(--dim);line-height:1.5;margin-bottom:22px}
.opt-card{
  width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  padding:15px;margin-bottom:10px;
}
.opt-card.on{border-color:var(--acc);background:var(--acc-dim)}
.opt-card b{display:block;font-size:16.5px;font-weight:700;margin-bottom:3px}
.opt-card span{font-size:13px;color:var(--dim);line-height:1.4}

/* ---------- dashboard v2 ---------- */
.weekstrip{display:flex;justify-content:space-between;gap:4px;margin:2px 2px 12px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 6px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.wd span{font-size:9.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.wd i{font-style:normal;font-size:13px;line-height:16px;height:16px}
.wd .dot2{width:7px;height:7px;border-radius:4px;background:var(--dim);opacity:.5;margin:4.5px 0}
.wd.today{border-color:var(--acc)}
.wd.star{background:var(--acc-dim)}
.qrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qchip{
  flex:0 0 auto;max-width:190px;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:15px;padding:9px 13px;
}
.qchip:active{background:var(--acc-dim)}
.qchip>div{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.qchip b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.qchip span{font-size:11px;color:var(--dim);white-space:nowrap}
.qchip .qi{font-size:15px}
.insight{display:flex;gap:10px;align-items:flex-start;padding:8px 2px}
.insight+.insight{border-top:1px solid var(--line)}
.insight .ii{font-size:16px;line-height:1.3;flex:0 0 22px;text-align:center}
.insight p{font-size:13.5px;line-height:1.45}
.insight p b{font-weight:800}
/* micronutrient bars */
.microrow{display:flex;align-items:center;gap:9px;padding:5px 0}
.microrow .ml{flex:0 0 84px;font-size:12px;font-weight:700;color:var(--dim)}
.microrow .mbar{flex:1;height:7px;border-radius:4px;background:var(--card2);overflow:hidden}
.microrow .mfill{height:100%;border-radius:4px;background:var(--acc);transition:width .6s cubic-bezier(.25,.8,.3,1)}
.microrow .mfill.warn{background:var(--red)}
.microrow .mv{flex:0 0 86px;text-align:right;font-size:11.5px;font-weight:700}
.microrow .mv small{color:var(--dim);font-weight:600}
/* nutrition grade badges (Nutri-Score palette) */
.gr{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:22px;height:22px;border-radius:7px;font-size:12px;font-weight:800;color:#fff;text-transform:uppercase}
.gr.est{opacity:.75}
.gr-a{background:#038141}.gr-b{background:#85BB2F}.gr-c{background:#F5B62E;color:#4a3a00}
.gr-d{background:#EF7E1A}.gr-e{background:#E63E11}
.gr.big{width:44px;height:44px;border-radius:14px;font-size:22px}
/* additive-count pill (colour = worst risk class) */
.ab{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  min-width:22px;height:22px;border-radius:7px;font-size:11px;font-weight:800;padding:0 5px}
.ab-0{background:rgba(47,214,113,.15);color:#2fd671}
.ab-1{background:rgba(245,182,46,.16);color:#d99a13}
.ab-2{background:rgba(239,126,26,.16);color:#EF7E1A}
.ab-3{background:rgba(230,62,17,.16);color:#ff6b4a}
body.light .ab-3{color:#d63515}body.light .ab-0{color:#1d9e52}
/* additive detail rows (log sheet + day summary) */
.addrow{display:flex;align-items:center;gap:4px;font-size:13px}
.addrow+.addrow{border-top:1px solid var(--line)}
/* the whole row is a tap target opening the additive's detail sheet */
.addtap{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:9px 2px;text-align:left;border-radius:10px}
.addtap:active{background:var(--card2)}
.addrow .adot{width:9px;height:9px;border-radius:5px;flex:0 0 auto}
.addrow .an{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow .an small{color:var(--dim);font-weight:600;margin-left:5px}
.addrow .ar{font-size:11.5px;font-weight:700;color:var(--dim);flex:0 0 auto}
.addrow .achev{color:var(--dim);font-size:16px;flex:0 0 auto;opacity:.6}
/* full-nutrition table in the log sheet */
.nutrow{display:flex;align-items:baseline;gap:8px;padding:5.5px 2px;font-size:13px}
.nutrow+.nutrow{border-top:1px solid var(--line)}
.nutrow .nl{flex:1;color:var(--dim);font-weight:600}
.nutrow .nv{font-weight:700}
.nutrow .nr{flex:0 0 74px;text-align:right;font-size:11.5px;color:var(--dim)}
.nutrow.sub .nl{padding-left:12px}
/* day-summary macro split donut */
.splitwrap{display:flex;align-items:center;gap:16px;padding:4px 2px}
.splitwrap svg{width:92px;height:92px;flex:0 0 auto;transform:rotate(-90deg)}
.splitleg{display:flex;flex-direction:column;gap:6px;font-size:13px}
.splitleg .row{gap:8px}
/* ---------- misc states ---------- */
/* ---------- narrow phones (many Androids are 360 px, some 320) ----------
   The hero ring is a fixed 186 px; below ~380 px that leaves too little
   room for the stat column and the "2314 / 2500" figures crowd. Shrink the
   ring and the type instead of letting anything wrap or clip.
   NAV IS DELIBERATELY UNTOUCHED HERE — its sizing is load-bearing on iOS. */
@media (max-width:380px){
  main{padding-left:10px;padding-right:10px}
  .ringwrap{flex:0 0 152px;width:152px;height:152px}
  .ringmid .rk-n{font-size:21px}
  .ringmid .rk-n.d4{font-size:17px}
  .ringmid .rk-n.d5{font-size:14px}
  .rstat .rv{font-size:15px}
  .rstat .rl{font-size:10.5px}
  .rstat .rv .of{font-size:11px}
  .daysum .ds b{font-size:14.5px}
  .daysum .ds span{font-size:9px}
  .card{padding:12px}
}
@media (max-width:330px){
  .ringwrap{flex:0 0 132px;width:132px;height:132px}
  .hero-in{gap:4px}
}
.empty{text-align:center;padding:34px 20px;color:var(--dim)}
.empty .serif{font-size:19px;font-style:italic;color:var(--text);margin-bottom:6px}
.empty p{font-size:13.5px;line-height:1.5}
.spin{
  width:22px;height:22px;border-radius:50%;margin:0 auto;
  border:2.5px solid var(--card2);border-top-color:var(--acc);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.fadein{animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* paste-an-estimate review rows */
.est-card{padding:12px 12px 11px}
.est-card+.est-card{border-top:1px solid var(--line)}
.est-card.off{opacity:.42}
.est-tick{
  width:36px;height:36px;border-radius:12px;flex:0 0 auto;font-size:15px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:1.5px solid var(--line);color:#fff;
}
.est-tick.on{background:var(--acc);border-color:var(--acc)}
.est-q{width:62px;flex:0 0 auto;text-align:center;padding:9px 4px;font-size:15px;font-weight:700}
.est-pre{
  background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;line-height:1.55;white-space:pre;overflow-x:auto;margin:0;
}
.est-note{font-size:11.5px;line-height:1.5;color:var(--dim);margin:7px 2px 0;padding-left:11px;text-indent:-11px}
.src-tag.est{background:rgba(95,168,255,.13);color:var(--mp)}

/* ---------------- storage durability ----------------
   THE BUG THIS FIXES (Android, Chrome WebAPK — reported as ~weekly total data
   loss, diagnosed in IronLog and identical here): by default a browser marks an
   origin's storage "best-effort", which leaves it free to evict the WHOLE
   origin — IndexedDB, localStorage and Cache Storage together — under storage
   pressure or after a stretch of inactivity. Eviction is silent and total, so it
   presents as "the app wiped my diary". A same-origin mirror is worthless
   against it; only an exported file survives, which is why the backup nag below
   matters as much as the persist() call.

   navigator.storage.persist() asks for the persistent bucket, which is exempt.
   Chrome grants it WITHOUT a prompt for an installed PWA (a WebAPK is one), so
   on the target phones this should simply come back true; Safari grants on
   similar engagement signals. Either way the answer is recorded and shown in
   Settings, so an unprotected device can be SEEN rather than guessed at.

   Deliberately: never throws, never blocks boot, and asks again on every launch
   — engagement accrues, so a refusal today can become a grant later. */
const STORE_ST={persisted:null,quota:0,usage:0,asked:false};
async function ensurePersistence(){
  try{
    if(!navigator.storage||!navigator.storage.persist)return STORE_ST;
    STORE_ST.asked=true;
    STORE_ST.persisted=await navigator.storage.persisted();
    if(!STORE_ST.persisted)STORE_ST.persisted=await navigator.storage.persist();
  }catch(e){/* unsupported or blocked — STORE_ST.persisted stays null */}
  return STORE_ST;
}
async function storageReport(){
  try{
    if(navigator.storage&&navigator.storage.persisted)
      STORE_ST.persisted=await navigator.storage.persisted();
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      STORE_ST.quota=e.quota||0;STORE_ST.usage=e.usage||0;
    }
  }catch(e){}
  return STORE_ST;
}

/* ---------------- IndexedDB ---------------- */
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      d.createObjectStore('foods',{keyPath:'id'});
      d.createObjectStore('entries',{keyPath:'id'});
      d.createObjectStore('meals',{keyPath:'id'});
      d.createObjectStore('body',{keyPath:'id'});
      d.createObjectStore('kv');
    };
    r.onsuccess=()=>{db=r.result;res(db)};
    r.onerror=()=>rej(r.error);
  });
}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const allOf=s=>req(store(s).getAll());
const dbPut=(s,v,k)=>req(store(s,'readwrite').put(v,k));
const dbDel=(s,k)=>req(store(s,'readwrite').delete(k));
const dbClear=s=>req(store(s,'readwrite').clear());
const kvGet=k=>req(store('kv').get(k));
const kvPut=(k,v)=>dbPut('kv',v,k);

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null)continue;
    if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v);
  }
  for(const kd of kids.flat(Infinity)){
    if(kd==null||kd==='')continue;
    el.append(kd.nodeType?kd:document.createTextNode(kd));
  }
  return el;
}

/* nutrient math — generic over the ZERO vector so new nutrients ride along */
function scaleMac(m,k){
  const o={};
  for(const key of Object.keys(ZERO))o[key]=(m[key]||0)*k;
  return o;
}
function addMac(a,b){
  const o={};
  for(const key of Object.keys(ZERO))o[key]=(a[key]||0)+(b[key]||0);
  return o;
}
// macros of one diary entry (grams-based if the food has per-100g data)
function entryMacros(en){
  const f=S.foods.get(en.foodId);
  if(!f)return {...ZERO};
  if(en.unit==='g'&&f.p100)return scaleMac(f.p100,en.amt/100);
  return scaleMac(f.per,en.amt);
}
function reindex(){
  S.byDate=new Map();
  for(const en of S.entries){
    let a=S.byDate.get(en.date);
    if(!a){a=[];S.byDate.set(en.date,a);}
    a.push(en);
  }
  for(const a of S.byDate.values())a.sort((x,y)=>x.ts-y.ts);
}
const entriesFor=ds=>S.byDate.get(ds)||[];
function dayTotals(ds){
  let t={...ZERO};
  for(const en of entriesFor(ds))t=addMac(t,entryMacros(en));
  return t;
}
// entry amount → human text ("2 × 1 large egg (50g)" / "150 g")
function amtLabel(en){
  const f=S.foods.get(en.foodId);
  if(!f)return '';
  if(en.unit==='g')return g1(en.amt)+' g';
  const n=en.amt===1?'':g1(en.amt)+' × ';
  return n+(f.servLabel||'serving');
}

/* ---------------- sheets / dialogs / toasts ---------------- */
const REDUCED=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function sheet(title,content,opts={}){
  let closed=false;
  const ov=h('div',{class:'overlay'});
  const body=h('div',{class:'sheet-body'},content);
  const head=h('div',{class:'sheet-head'},
    h('h2',{},title),
    h('button',{class:'sheet-x',onclick:()=>close()},'✕'));
  /* grabber + title form the drag handle. Deliberately NOT the body —
     dragging from a scrollable area fights the scroll and feels broken. */
  const drag=h('div',{class:'sheet-drag'},h('div',{class:'grabber'}),head);
  const sh=h('div',{class:'sheet'},drag,body);
  ov.append(sh);
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  document.body.append(ov);
  requestAnimationFrame(()=>ov.classList.add('open'));
  // drag down to dismiss: past ~110 px, or a quick flick
  let sy=null,dy=0,t0=0;
  drag.addEventListener('pointerdown',e=>{
    sy=e.clientY;dy=0;t0=performance.now();
    sh.classList.add('dragging');
    try{drag.setPointerCapture(e.pointerId);}catch(err){}
  });
  drag.addEventListener('pointermove',e=>{
    if(sy==null)return;
    dy=Math.max(e.clientY-sy,0);
    sh.style.transform='translateY('+dy+'px)';
    ov.style.opacity=String(Math.max(1-dy/420,.2));
  });
  const settle=()=>{
    if(sy==null)return;
    sh.classList.remove('dragging');
    const vel=dy/Math.max(performance.now()-t0,1);
    const go=dy>110||vel>.55;
    sy=null;
    sh.style.transform='';ov.style.opacity='';
    if(go)close();
  };
  drag.addEventListener('pointerup',settle);
  drag.addEventListener('pointercancel',settle);
  function close(){
    if(closed)return;closed=true;
    ov.classList.remove('open');
    setTimeout(()=>ov.remove(),REDUCED()?20:380);   // match the slide-out
    if(opts.onClose)opts.onClose();
  }
  return close;
}
/* Count a number up/down to its new value. `from` comes from the caller's
   own previous-state record, not the element, so the tween survives the
   full re-render that follows every log. */
function animNum(el,from,to,fmt){
  if(el._nr)cancelAnimationFrame(el._nr);
  if(from==null||Math.abs(to-from)<.5||REDUCED()){el.textContent=fmt(to);el._nr=0;return;}
  const t0=performance.now(),dur=560;
  const step=now=>{
    const k=Math.min((now-t0)/dur,1),e=1-Math.pow(1-k,3);   // easeOutCubic
    el.textContent=fmt(from+(to-from)*e);
    el._nr=k<1?requestAnimationFrame(step):0;
  };
  el._nr=requestAnimationFrame(step);
}
// one-shot pop, used when a macro goal flips into "met"
function popEl(el){
  if(!el||REDUCED())return;
  el.classList.remove('pop');
  void el.offsetWidth;              // restart the animation
  el.classList.add('pop');
  setTimeout(()=>el.classList.remove('pop'),560);
}
function ask(title,msg,okLabel,danger){
  return new Promise(res=>{
    let done=false;
    const c=h('div',{},
      h('p',{class:'dim small',style:'margin:2px 2px 16px'},msg),
      h('button',{class:'btn '+(danger?'danger':'primary'),onclick:()=>{done=true;close();res(true);}},okLabel||'Confirm'),
      h('button',{class:'btn mt8',onclick:()=>close()},'Cancel'));
    const close=sheet(title,c,{onClose:()=>{if(!done)res(false);}});
  });
}
function toast(msg,opts={}){
  const t=h('div',{class:'toast'+(opts.pr?' pr':'')},msg);
  $('#toasts').append(t);
  requestAnimationFrame(()=>t.classList.add('in'));
  setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),300)},opts.dur||2400);
}
function seg(opts,cur,cb){
  const el=h('div',{class:'seg'});
  for(const o of opts){
    const val=Array.isArray(o)?o[0]:o, label=Array.isArray(o)?o[1]:o;
    const b=h('button',{class:val===cur?'on':'',onclick:()=>{
      [...el.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on');cb(val);
    }},label);
    el.append(b);
  }
  return el;
}

async function bumpUse(f){f.used=(f.used||0)+1;f.lastUsed=Date.now();await dbPut('foods',f);}
async function logEntry(o){
  const en={id:'e'+uid(),date:o.date,meal:o.meal,foodId:o.foodId,
    amt:o.amt,unit:o.unit,ts:o.ts||Date.now()};
  S.entries.push(en);reindex();
  await dbPut('entries',en);
  const f=S.foods.get(en.foodId);
  if(f)await bumpUse(f);
  return en;
}

async function deleteEntry(id){
  S.entries=S.entries.filter(e=>e.id!==id);reindex();
  await dbDel('entries',id);
}

/* ---------------- progress rings (nested, Apple-Fitness style) ------------
   SVG circles with pathLength=100 → dasharray math stays in percent.
   Gradient stops use CSS vars so accent/theme swaps recolor them live. */
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs){
  const el=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(attrs||{}))el.setAttribute(k,v);
  return el;
}
const RG={};   // ring refs: {k:{arc,val},p:{...},c:{...},f:{...}} + mid/remain
function ringsEl(){
  const svg=sv('svg',{viewBox:'0 0 180 180'});
  const defs=sv('defs',{});
  const G=[['gk','var(--acc)','var(--acc2)'],['gp','var(--mp)','var(--mp2)'],
           ['gc','var(--mc)','var(--mc2)'],['gf','var(--mf)','var(--mf2)']];
  for(const[id,c0,c1]of G){
    const lg=sv('linearGradient',{id,x1:0,y1:0,x2:1,y2:1});
    const s0=sv('stop',{offset:0});s0.style.stopColor=c0;
    const s1=sv('stop',{offset:1});s1.style.stopColor=c1;
    lg.append(s0,s1);defs.append(lg);
  }
  svg.append(defs);
  const SPEC=[['k',78,13,'gk','rk'],['p',60,11,'gp','rp'],['c',44,10,'gc','rc'],['f',30,9,'gf','rf']];
  for(const[key,r,w,grad,cls]of SPEC){
    svg.append(sv('circle',{class:'ring-track',cx:90,cy:90,r,'stroke-width':w}));
    const arc=sv('circle',{class:'ring-arc '+cls,cx:90,cy:90,r,'stroke-width':w,
      stroke:'url(#'+grad+')',pathLength:100});
    svg.append(arc);
    RG[key]={arc};
  }
  return svg;
}
function rstatRow(key,label,color){
  // number and "/ target" are separate nodes so the figure can tween
  // without rebuilding markup on every frame
  const num=h('b',{}),of=h('span',{class:'of'});
  const val=h('span',{class:'rv num',style:'--metc:'+color},num,of);
  RG[key].val=val;RG[key].num=num;RG[key].of=of;
  return h('div',{class:'rstat'},
    h('span',{class:'rdot',style:'background:'+color}),
    h('div',{class:'grow'},h('div',{class:'rl'},label),val));
}
/* per-macro "goal met" — the SAME tolerances as starDay so the ring glow,
   the ⭐ and the diary tiles always agree: kcal ±10%, protein ≥90% of
   target, carbs & fat ±20% (hitting protein is good; blowing far past
   kcal is not, so kcal celebrates a window, not a floor). */
function macroMet(key,t,g){
  const within=(v,tv,tol)=>tv>0&&Math.abs(v-tv)<=tv*tol;
  if(key==='k')return within(t.kcal,g.kcal,.1);
  if(key==='p')return g.p>0&&t.p>=g.p*.9;
  if(key==='c')return within(dispC(t),g.c,.2);
  return within(t.f,g.f,.2);
}
const RGPREV={};   // last rendered figures, so tweens survive a re-render
const RGMET={};    // last met-state, so the pop only fires on the flip
function ringsUpdate(){
  const today=todayStr();
  const t=dayTotals(today),tg=targetFor(today);
  const spec=[['k',t.kcal,tg.kcal,'',kc],['p',t.p,tg.p,'g',g1],['c',dispC(t),tg.c,'g',g1],['f',t.f,tg.f,'g',g1]];
  for(const[key,v,target,unit,fmt]of spec){
    const pct=target>0?v/target:0;
    const met=macroMet(key,t,tg);
    RG[key].arc.style.strokeDashoffset=String(100-clamp(pct,0,1)*100);
    RG[key].arc.classList.toggle('met',met);
    if(RG[key].val){
      animNum(RG[key].num,RGPREV[key],v,fmt);
      RG[key].of.textContent=' / '+fmt(target)+unit;
      RG[key].val.classList.toggle('over',pct>1.02&&!met);   // met wins over amber
      RG[key].val.classList.toggle('met',met);
      if(met&&RGMET[key]===false)popEl(RG[key].val);         // just crossed the line
    }
    RGPREV[key]=v;RGMET[key]=met;
  }
  if(RG.mid){
    const txt=String(kc(t.kcal));
    // size from the FINAL figure so the type doesn't jump mid-count
    RG.mid.classList.toggle('d4',txt.length===4);
    RG.mid.classList.toggle('d5',txt.length>=5);
    animNum(RG.mid,RGPREV.mid,t.kcal,kc);
    RGPREV.mid=t.kcal;
  }
  const star=starDay(today);
  FX.star=star;   // hero canvas: gold twinkle + firework mode on a star day
  // RG.hero is set by renderToday; FX.cv isn't assigned until the rAF that
  // follows, so it would be a render behind here
  if(RG.hero)RG.hero.classList.toggle('star',star);
  const left=tg.kcal-t.kcal;
  if(RG.remain){
    RG.remain.classList.toggle('over',left<0&&!star);
    if(!RG.remainNum||RG.remainNum.parentElement!==RG.remain){
      RG.remain.innerHTML='';
      RG.remainNum=h('b',{class:'num'});
      RG.remainTxt=h('span',{});
      RG.remain.append(RG.remainNum,RG.remainTxt);
    }
    animNum(RG.remainNum,RGPREV.remain,Math.abs(left),kc);
    RGPREV.remain=Math.abs(left);
    RG.remainTxt.innerHTML=(left>=0?' kcal remaining':' kcal over target')
      +(star?' · <b style="color:var(--gold)">⭐ star day</b>':'');
  }
  // fireworks the FIRST time each day qualifies as a star day
  if(star&&localStorage.getItem('mlFete')!==today){
    try{localStorage.setItem('mlFete',today);}catch(e){}
    fxBurst();
  }
}

/* ---------------- ambient particle canvas (hero background) ------------
   Deliberately cheap: ~22 particles + 2 blurred drift blobs, DPR capped
   at 2, and the rAF loop stops whenever the tab is hidden or the user is
   not on Today (battery rule from the design brief). */
const FX={cv:null,ctx:null,parts:[],raf:0,w:0,h:0,acc:'#C9A96D',t0:0,
  star:false,rockets:[],sparks:[],flashes:[],pendingBurst:false,nextLaunch:0,cols:null};
const FX_GOLD='#ffcf4d';
function fxColor(){
  const cs=getComputedStyle(document.body);
  const v=n=>cs.getPropertyValue(n).trim();
  FX.acc=v('--acc')||'#C9A96D';
  // firework palette = the app's own accent + macro identity colours, so the
  // show always matches the active theme (cached: getComputedStyle per frame
  // would be a layout read inside the rAF loop)
  FX.cols=[FX.acc,v('--acc2')||FX.acc,FX_GOLD,
    v('--mp')||'#5FA8FF',v('--mc')||'#F5B62E',v('--mf')||'#B07AFF'];
}
const fxPick=()=>FX.cols[(Math.random()*FX.cols.length)|0];
function fxEnsure(cv){
  FX.cv=cv;FX.ctx=cv.getContext('2d');
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=cv.offsetWidth,hh=cv.offsetHeight;
  cv.width=w*dpr;cv.height=hh*dpr;
  FX.ctx.scale(dpr,dpr);FX.w=w;FX.h=hh;
  fxColor();
  FX.parts=[];
  for(let i=0;i<22;i++)FX.parts.push({
    x:Math.random()*w,y:Math.random()*hh,
    r:.8+Math.random()*1.8,
    vy:.08+Math.random()*.22,
    ph:Math.random()*6.28,a:.12+Math.random()*.3});
  if(FX.pendingBurst){FX.pendingBurst=false;fxBurst();}
  fxStart();
}
/* ---- star-day fireworks ----------------------------------------------
   Real firework physics rather than a static puff: a shell launches from
   the bottom edge (anywhere across the full width), coasts to its apex,
   then explodes into a ring of sparks that fall under gravity and burn
   out. Sparks are drawn as short streaks from their previous position
   with 'lighter' compositing, which is what gives the trailing glow —
   and costs one line per spark instead of a blur filter. */
function fxRocket(){
  const x=FX.w*(.07+Math.random()*.86);       // full-width launch spread
  return {x,y:FX.h+3,px:x,py:FX.h+3,
    vx:(Math.random()-.5)*.4,vy:-(1.7+Math.random()*.85),
    apex:FX.h*(.14+Math.random()*.4),col:fxPick()};
}
function fxExplode(x,y,col){
  const n=17+(Math.random()*11|0);
  const spd=1.15+Math.random()*1.05;
  const mixGold=Math.random()<.45;            // some shells are two-tone
  for(let i=0;i<n;i++){
    const a=(i/n)*6.283+Math.random()*.24;    // ring + jitter = organic
    const v=spd*(.72+Math.random()*.56);
    FX.sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      life:1,decay:.0085+Math.random()*.009,r:1.25+Math.random()*1.15,
      col:(mixGold&&Math.random()<.5)?FX_GOLD:col});
  }
  FX.flashes.push({x,y,life:1,col});          // muzzle flash at the burst
}
// big opening volley — first time each day turns into a ⭐ star day
function fxBurst(){
  if(!FX.cv||!FX.cv.isConnected){FX.pendingBurst=true;return;}
  fxColor();
  for(let i=0;i<4;i++){
    const r=fxRocket();
    r.y+=i*26;r.py=r.y;                       // stagger so they climb apart
    FX.rockets.push(r);
  }
  FX.nextLaunch=0;
  fxStart();
}
function fxTick(ts){
  FX.raf=0;
  if(document.hidden||S.tab!=='today'||!FX.cv||!FX.cv.isConnected)return;
  const c=FX.ctx,w=FX.w,hh=FX.h,t=ts/1000;
  c.clearRect(0,0,w,hh);
  // two soft accent blobs drifting in a slow figure-eight
  for(let i=0;i<2;i++){
    const bx=w*(.3+.4*i)+Math.sin(t*.13+i*2.4)*w*.18;
    const by=hh*(.35+.25*i)+Math.cos(t*.11+i*1.7)*hh*.2;
    const g=c.createRadialGradient(bx,by,0,bx,by,110);
    g.addColorStop(0,FX.acc+(i?'14':'1A'));g.addColorStop(1,FX.acc+'00');
    c.fillStyle=g;c.fillRect(0,0,w,hh);
  }
  // star-day mode: ambient motes go gold and twinkle harder
  c.fillStyle=FX.star?FX_GOLD:FX.acc;
  for(const p of FX.parts){
    p.y-=p.vy;p.x+=Math.sin(t*.5+p.ph)*.12;
    if(p.y<-4){p.y=hh+4;p.x=Math.random()*w;}
    c.globalAlpha=FX.star
      ?Math.min(p.a*1.9,.7)*(0.5+0.5*Math.sin(t*1.7+p.ph))
      :p.a*(0.6+0.4*Math.sin(t*.8+p.ph));
    c.beginPath();c.arc(p.x,p.y,FX.star?p.r*1.15:p.r,0,6.283);c.fill();
  }
  // steady launch cadence while every target is met — a shell roughly
  // every 0.7–1.6 s, occasionally two, spread across the whole widget.
  // Capped so a long session on Today can't accumulate particles.
  if(FX.star){
    if(!FX.nextLaunch)FX.nextLaunch=ts+250;
    if(ts>=FX.nextLaunch&&FX.sparks.length<300){
      FX.nextLaunch=ts+700+Math.random()*900;
      FX.rockets.push(fxRocket());
      if(Math.random()<.33)FX.rockets.push(fxRocket());
    }
  }else FX.nextLaunch=0;
  if(FX.rockets.length||FX.sparks.length||FX.flashes.length){
    c.globalCompositeOperation='lighter';   // overlapping sparks bloom
    c.lineCap='round';
    // climbing shells: a bright head with an exhaust trail behind it
    for(let i=FX.rockets.length-1;i>=0;i--){
      const r=FX.rockets[i];
      r.x+=r.vx;r.y+=r.vy;r.vy+=.021;
      if(r.y<=r.apex||r.vy>=-.28){
        FX.rockets.splice(i,1);
        fxExplode(r.x,r.y,r.col);
        continue;
      }
      c.globalAlpha=.8;c.strokeStyle=r.col;c.lineWidth=2;
      c.beginPath();c.moveTo(r.x-r.vx*5,r.y-r.vy*5);c.lineTo(r.x,r.y);c.stroke();
    }
    // burst flashes: a quick radial bloom where the shell opened
    for(let i=FX.flashes.length-1;i>=0;i--){
      const fl=FX.flashes[i];
      fl.life-=.09;
      if(fl.life<=0){FX.flashes.splice(i,1);continue;}
      const rad=6+26*(1-fl.life);
      const g2=c.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,rad);
      g2.addColorStop(0,fl.col+'CC');g2.addColorStop(1,fl.col+'00');
      c.globalAlpha=fl.life*.55;c.fillStyle=g2;
      c.beginPath();c.arc(fl.x,fl.y,rad,0,6.283);c.fill();
    }
    /* Sparks: gravity + drag + burn-out. The streak is drawn from an
       extrapolated tail (velocity × 4) rather than the last frame's
       position — a single frame's travel is barely a pixel, which read as
       dots instead of fireworks. Bright head dot on top sells the comet. */
    for(let i=FX.sparks.length-1;i>=0;i--){
      const p=FX.sparks[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=.026;p.vx*=.985;p.vy*=.985;
      p.life-=p.decay;
      if(p.life<=0||p.y>hh+8){FX.sparks.splice(i,1);continue;}
      const a=clamp(p.life,0,1);
      const lw=p.r*(.45+.55*a);
      c.globalAlpha=a*.55;
      c.strokeStyle=p.col;c.lineWidth=lw;
      c.beginPath();c.moveTo(p.x-p.vx*4,p.y-p.vy*4);c.lineTo(p.x,p.y);c.stroke();
      c.globalAlpha=a*.95;
      c.fillStyle=p.col;
      c.beginPath();c.arc(p.x,p.y,lw*.62,0,6.283);c.fill();
    }
    c.globalCompositeOperation='source-over';
  }
  c.globalAlpha=1;
  FX.raf=requestAnimationFrame(fxTick);
}
function fxStart(){if(!FX.raf&&FX.cv)FX.raf=requestAnimationFrame(fxTick);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fxStart();});

/* ---------------- adherence & streaks ----------------
   A day "counts" when something was logged AND calories landed within
   ±10% of target — a forgiving-but-honest adherence definition. */
function adherent(ds){
  if(!entriesFor(ds).length)return false;
  const t=dayTotals(ds).kcal,tg=targetFor(ds).kcal;
  return tg>0&&Math.abs(t-tg)<=tg*.1;
}
function streaks(){
  const today=todayStr();
  let cur=0,d=adherent(today)?today:addDays(today,-1);
  while(adherent(d)&&cur<999){cur++;d=addDays(d,-1);}
  let best=cur,run=0,scan=today;
  for(let i=0;i<400;i++){
    if(adherent(scan)){run++;if(run>best)best=run;}
    else run=0;
    scan=addDays(scan,-1);
  }
  return {cur,best};
}
function weekAvg(){
  let sum=0,n=0;
  for(let i=0;i<7;i++){
    const ds=addDays(todayStr(),-i-0);
    if(entriesFor(ds).length){sum+=dayTotals(ds).kcal;n++;}
  }
  return n?{avg:sum/n,n}:null;
}

/* ---------------- Dashboard tab ----------------
   Rings + week strip + one-tap quick log + insights + micros + food
   quality. Meal-by-meal editing lives in Diary — the dashboard is for
   reading the day at a glance and firing the common actions. */
/* Backup nag (v3.3). A browser can clear a "best-effort" origin at any time and
   an exported file is the only copy that survives it — so once there is real
   history to lose, ask for one. Read from cached kv (BK.last / BK.snooze, primed
   at boot) because renderToday is synchronous. Deliberately a dismissible card
   rather than a toast: it should still be there tomorrow if it is ignored.
   Threshold is DAYS LOGGED, not entries — a food diary racks up entries several
   a day, so "5 entries" would fire on the first afternoon. */
const BK={last:null,snooze:0};
const NAG_AFTER_D=21, NAG_SNOOZE_D=7, NAG_MIN_DAYS=5;
function backupDueDays(now){
  if(BK.last==null)return Infinity;
  return Math.floor((now-BK.last)/86400000);
}
function backupNagDue(env){
  if(env.days<NAG_MIN_DAYS)return false;
  if(env.snooze&&(env.now-env.snooze)<NAG_SNOOZE_D*86400000)return false;
  if(env.last==null)return true;
  return (env.now-env.last)>=NAG_AFTER_D*86400000;
}
function backupNagCard(){
  const now=Date.now();
  if(!backupNagDue({days:S.byDate.size,last:BK.last,snooze:BK.snooze,now}))return null;
  const d=backupDueDays(now);
  return h('div',{class:'nag'},
    h('div',{class:'nag-i'},'🛟'),
    h('div',{class:'grow'},
      h('div',{class:'nag-t'},BK.last==null?'Back up your food diary':'Your backup is '+d+' days old'),
      h('div',{class:'nag-s'},S.byDate.size+' logged days live only on this device. Browsers can clear app data to free up space — a backup file is what gets it back.')),
    h('button',{class:'nag-go',onclick:canShareBackup()?shareBackup:downloadExport},'Back up'),
    h('button',{class:'nag-x','aria-label':'Remind me later',onclick:async()=>{
      BK.snooze=Date.now();
      try{await kvPut('backupSnooze',BK.snooze);}catch(e){}
      nagRefresh();
    }},'✕'));
}
/* Drops the nag without re-rendering Today: renderToday rebuilds the hero, which
   restarts the ring tween and re-seeds the fireworks canvas — too much for "you
   just pressed Back up". Settings IS re-rendered, so its last-backup line and
   persistence pill refresh in place. */
function nagRefresh(){
  document.querySelectorAll('.nag').forEach(el=>el.remove());
  if(S.tab==='settings')renderSettings();
}
function renderToday(){
  const pg=$('#pg-today');pg.innerHTML='';
  const cv=h('canvas',{id:'fx'});
  const ringwrap=h('div',{class:'ringwrap'});
  ringwrap.append(ringsEl());
  const midN=h('div',{class:'rk-n num'},'0');
  RG.mid=midN;
  ringwrap.append(h('div',{class:'ringmid'},midN,h('div',{class:'rk-l'},'kcal')));
  const stats=h('div',{class:'ringstats'},
    rstatRow('k','Calories','var(--acc)'),
    rstatRow('p','Protein','var(--mp)'),
    rstatRow('c',carbLbl(),'var(--mc)'),
    rstatRow('f','Fat','var(--mf)'));
  const remain=h('div',{class:'remain num'});
  RG.remain=remain;RG.remainNum=null;   // rebuilt below; tween state lives in RGPREV
  const hero=h('div',{class:'card hero'},cv,
    h('div',{class:'hero-in'},ringwrap,stats),remain);
  RG.hero=hero;
  pg.append(hero,weekStripEl());
  const nag=backupNagCard();
  if(nag)pg.append(nag);
  pg.append(h('div',{class:'addsec'},h('h4',{},'Quick log'),
    h('button',{class:'linkbtn',onclick:()=>switchTab('add')},'See all →')));
  pg.append(quickRowEl());
  pg.append(insightsCard(),microCardEl(),qualityCardEl());
  ringsUpdate();
  requestAnimationFrame(()=>fxEnsure(cv));   // canvas needs layout first
}

/* star day = every target closely met (kcal ±10%, protein ≥90%,
   carbs & fat ±20%) — the "closely met" definition behind ⭐ everywhere */
function starDay(ds){
  if(!entriesFor(ds).length)return false;
  const t=dayTotals(ds),g=targetFor(ds);
  const within=(v,tv,tol)=>tv>0&&Math.abs(v-tv)<=tv*tol;
  return within(t.kcal,g.kcal,.1)&&t.p>=g.p*.9&&within(dispC(t),g.c,.2)&&within(t.f,g.f,.2);
}
function lastNDays(n,off){
  const out=[];
  for(let i=0;i<n;i++)out.push(addDays(todayStr(),-(i+(off||0))));
  return out;
}
function avgOver(days,key){
  let s=0,n=0;
  for(const d of days)if(entriesFor(d).length){s+=dayTotals(d)[key];n++;}
  return n?{avg:s/n,n}:null;
}

function weekStripEl(){
  const strip=h('div',{class:'weekstrip'});
  for(let i=6;i>=0;i--){
    const ds=addDays(todayStr(),-i);
    const star=starDay(ds),logged=entriesFor(ds).length>0;
    const wd=new Date(ds+'T12:00').toLocaleDateString(undefined,{weekday:'narrow'});
    const mark=star?h('i',{},'⭐'):logged?h('span',{class:'dot2'}):h('i',{style:'opacity:.18'},'·');
    // tap = full nutrition summary for that day (macro split + micro table);
    // the sheet's own button jumps into the Diary for editing
    strip.append(h('button',{class:'wd'+(i===0?' today':'')+(star?' star':''),
      onclick:()=>daySummarySheet(ds)},
      h('span',{},wd),mark));
  }
  return strip;
}

function quickRowEl(){
  const row=h('div',{class:'qrow'});
  row.append(h('button',{class:'qchip',onclick:()=>copyDaySheet(todayStr())},
    h('span',{class:'qi'},'⧉'),
    h('div',{},h('b',{},'Copy yesterday'),h('span',{},'whole day or one meal'))));
  const mls=[...S.meals].sort((a,b)=>(b.used||0)-(a.used||0)).slice(0,4);
  for(const m of mls){
    const t=mealMacros(m);
    row.append(h('button',{class:'qchip',onclick:()=>logMealSheet(m)},
      h('span',{class:'qi'},'☰'),
      h('div',{},h('b',{},m.name),h('span',{class:'num'},kc(t.kcal)+' kcal · '+m.items.length+' items'))));
  }
  const freq=[...S.foods.values()].filter(f=>!f.hidden&&(f.used||0)>=2)
    .sort((a,b)=>b.used-a.used).slice(0,6);
  for(const f of freq){
    row.append(h('button',{class:'qchip',onclick:()=>openLogSheet(f)},
      h('div',{},h('b',{},f.name),h('span',{class:'num'},kc((f.per||ZERO).kcal)+' kcal · logged '+f.used+'×'))));
  }
  if(row.children.length===1)
    row.append(h('div',{class:'qchip',style:'border-style:dashed'},
      h('div',{},h('b',{class:'dim'},'Your meals & regulars land here'),
      h('span',{},'log a few foods first'))));
  return row;
}

/* rule-based trend insights — plain sentences, max 4, most useful first */
function insightLines(){
  const out=[],t=S.set.t;
  const wk0=avgOver(lastNDays(7),'kcal'),wk1=avgOver(lastNDays(7,7),'kcal');
  let stars=0;
  for(const d of lastNDays(7))if(starDay(d))stars++;
  if(stars)out.push(['⭐','<b>'+stars+' star day'+(stars===1?'':'s')+'</b> this week — targets closely met.']);
  if(wk0&&wk1&&wk0.n>=3&&wk1.n>=3){
    const d=Math.round(wk0.avg-wk1.avg);
    out.push(Math.abs(d)>=100
      ?['⚖️','You’ve eaten <b>'+Math.abs(d)+' '+(d>0?'more':'fewer')+' kcal/day</b> than last week.']
      :['⚖️','Steady week — within <b>100 kcal/day</b> of last week.']);
  }
  const pr=avgOver(lastNDays(7),'p');
  if(pr&&pr.n>=3){
    if(pr.avg>=t.p)out.push(['💪','Protein on point — averaging <b>'+g1(pr.avg)+' g/day</b> (target '+g1(t.p)+' g).']);
    else if(pr.avg<t.p*.75)out.push(['💪','Protein is lagging — <b>'+g1(pr.avg)+' g/day</b> vs your '+g1(t.p)+' g target.']);
  }
  // weakest nutrient of the week across ALL tracked micros (limits excluded)
  const TIPS={iron:'red meat, lentils and spinach help',k:'bananas, potatoes and dairy help',
    ca:'dairy, almonds and greens help',vitc:'citrus, peppers and broccoli help',
    mag:'nuts, seeds and whole grains help',zn:'meat, shellfish and pumpkin seeds help',
    vita:'carrots, sweet potato and eggs help',vitd:'oily fish and egg yolks help (and sunshine)',
    vite:'almonds, seeds and olive oil help',b12:'meat, fish and dairy help — or a supplement',
    fol:'leafy greens, beans and lentils help'};
  let worst=null;
  for(const[key,label,unit,,,isLimit]of MICROS){
    if(isLimit)continue;
    const a=avgOver(lastNDays(7),key);
    if(!a||a.n<3)continue;
    const ratio=a.avg/microRDA(key);
    if(ratio<.6&&(!worst||ratio<worst.ratio))worst={key,label,unit,avg:a.avg,ratio};
  }
  if(worst)out.push(['🥦','Try to increase your <b>'+worst.label.toLowerCase()+
    '</b> intake — averaging '+g1(worst.avg)+' '+worst.unit+' of the '+
    g1(microRDA(worst.key))+' '+worst.unit+' guideline; '+TIPS[worst.key]+'.']);
  // ceiling nutrients: flag sustained overshoot
  const na=avgOver(lastNDays(7),'sod');
  if(na&&na.n>=3&&na.avg>microRDA('sod')*1.15)
    out.push(['🧂','Sodium is averaging <b>'+kc(na.avg)+' mg/day</b> — above the '+kc(microRDA('sod'))+' mg guideline.']);
  const cf=avgOver(lastNDays(7),'caff');
  if(cf&&cf.avg>microRDA('caff'))out.push(['☕','Caffeine is averaging <b>'+kc(cf.avg)+' mg/day</b> — above the '+kc(microRDA('caff'))+' mg guideline.']);
  // additive exposure: sustained high-risk items are worth a nudge
  let hiAdd=0;
  for(const d of lastNDays(7))hiAdd+=dayAdditiveStats(d).hi;
  if(hiAdd>=3)out.push(['⚗️','<b>'+hiAdd+' items</b> with high-risk additives this week — watch for the red count badge when picking products.']);
  const q0=qualityAvg(lastNDays(7)),q1=qualityAvg(lastNDays(7,7));
  if(q0!=null){
    let txt='Food quality this week averages <b>'+gradeLetter(q0)+'</b>';
    if(q1!=null&&Math.abs(q0-q1)>=.25)txt+=q0>q1?' — up from '+gradeLetter(q1)+'.':' — down from '+gradeLetter(q1)+'.';
    else txt+='.';
    out.push(['🥗',txt]);
  }
  return out.slice(0,5);
}

/* ---------------- any-day nutrition summary (sheet) ----------------
   Full read of a single day — macros vs that day's targets, kcal split,
   the complete micro table and quality/additive verdicts — reachable from
   the dashboard week strip and the Diary, so past days are never opaque. */
function splitDonut(t){
  const cals=[t.p*4,t.c*4,t.f*9];
  const tot=cals[0]+cals[1]+cals[2];
  if(tot<=0)return null;
  const svg=sv('svg',{viewBox:'0 0 100 100'});
  const cols=['var(--mp)','var(--mc)','var(--mf)'];
  let start=0;
  cals.forEach((v,i)=>{
    const seg=v/tot*100;
    if(seg<=0)return;
    svg.append(sv('circle',{cx:50,cy:50,r:38,fill:'none',stroke:cols[i],'stroke-width':15,
      pathLength:100,'stroke-dasharray':seg+' '+(100-seg),'stroke-dashoffset':String(-start)}));
    start+=seg;
  });
  return {svg,cals,tot};
}

/* ---------------- copy a previous day's entries ---------------- */
function copyDaySheet(target){
  let src=addDays(target,-1);
  const picks=Object.fromEntries(MEALS.map(([mk])=>[mk,true]));
  const list=h('div',{class:'listcard mt8'});
  const copyBtn=h('button',{class:'btn primary mt12'});
  const srcIn=h('input',{type:'date',class:'in',value:src,onchange:e=>{
    if(e.target.value){src=e.target.value;redraw();}
  }});
  function redraw(){
    list.innerHTML='';
    let any=0;
    for(const[mk,label]of MEALS){
      const ens=entriesFor(src).filter(e=>e.meal===mk);
      if(!ens.length)continue;
      any+=ens.length;
      let sum={...ZERO};
      for(const e of ens)sum=addMac(sum,entryMacros(e));
      const cb=h('input',{type:'checkbox',onchange:e=>{picks[mk]=e.target.checked;count();}});
      cb.checked=picks[mk];
      const mid=h('div',{class:'grow'},
        h('div',{class:'fr-name'},label),
        h('div',{class:'fr-sub num'},ens.length+' item'+(ens.length===1?'':'s')+' · '+kc(sum.kcal)+' kcal'));
      list.append(h('label',{class:'food-row',style:'cursor:pointer'},cb,mid));
    }
    if(!any)list.append(h('div',{class:'mealempty'},h('i',{},'Nothing logged on '+fmtDay(src))));
    count();
  }
  /* Copying is idempotent: anything already on the target day with the same
     food+meal+amount (auto-logged daily staples, or a copy pressed twice)
     is skipped, not doubled. Multiset counting keeps genuine duplicates
     WITHIN the source day (e.g. two identical snacks) copyable. */
  const ekey=e=>e.foodId+'|'+e.meal+'|'+e.amt+'|'+e.unit;
  function copyPlan(){
    const have=new Map();
    for(const e of entriesFor(target))have.set(ekey(e),(have.get(ekey(e))||0)+1);
    const copy=[];let skip=0;
    for(const[mk]of MEALS){
      if(!picks[mk])continue;
      for(const en of entriesFor(src).filter(e=>e.meal===mk)){
        const k=ekey(en),n=have.get(k)||0;
        if(n>0){have.set(k,n-1);skip++;}
        else copy.push(en);
      }
    }
    return {copy,skip};
  }
  function count(){
    const {copy,skip}=copyPlan();
    const n=copy.length;
    copyBtn.textContent=n
      ?'Copy '+n+' item'+(n===1?'':'s')+' to '+(target===todayStr()?'today':fmtDay(target))+
        (skip?' ('+skip+' already there)':'')
      :skip?'All '+skip+' already there — nothing to copy':'Nothing selected';
    copyBtn.disabled=!n;
    copyBtn.style.opacity=n?'':'0.5';
  }
  copyBtn.addEventListener('click',async()=>{
    const {copy,skip}=copyPlan();
    for(const en of copy)
      await logEntry({date:target,meal:en.meal,foodId:en.foodId,amt:en.amt,unit:en.unit});
    haptic();close();renderTab(S.tab);
    toast('Copied '+copy.length+' item'+(copy.length===1?'':'s')+
      (skip?' · '+skip+' skipped (already there)':'')+' ✓',{pr:true});
  });
  const close=sheet('Copy a day',h('div',{},
    labeled('Copy from',srcIn),list,copyBtn));
  redraw();
}

function frRow(en){
  const f=S.foods.get(en.foodId);
  const m=entryMacros(en);
  const sub=esc(amtLabel(en))+
    ' · <span class="mch"><span class="p">P<b>'+g1(m.p)+'</b></span>'+
    '<span class="c">C<b>'+g1(dispC(m))+'</b></span>'+

  const mid=h('div',{class:'grow'},
    h('div',{class:'fr-name'},f?f.name:'(deleted food)'),
    h('div',{class:'fr-sub',html:sub}));
  const kcalEl=h('div',{class:'fr-kcal num'},h('b',{},kc(m.kcal)),h('span',{},'kcal'));
  const slide=h('div',{class:'fr-slide'},frThumb(f),mid,kcalEl);
  const acts=h('div',{class:'fr-acts'},
    h('button',{class:'fa-e',onclick:()=>{closeOpenRow();editEntrySheet(en);}},'Edit'),
    h('button',{class:'fa-d',onclick:async()=>{
      closeOpenRow();await deleteEntry(en.id);
      renderTab(S.tab);toast('Entry deleted');
    }},'Delete'));
  const row=h('div',{class:'fr-row'},acts,slide);
  let sx=null,sy=0,cur=0,base=0,lock=null;
  slide.addEventListener('pointerdown',e=>{
    sx=e.clientX;sy=e.clientY;
    base=(openRow===slide)?-132:0;cur=base;lock=null;
  });
  slide.addEventListener('pointermove',e=>{
    if(sx==null)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(lock==null){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.4){
        lock='x';slide.classList.add('drag');closeOpenRow(slide);
      }else if(Math.abs(dy)>10)lock='y';
    }
    if(lock!=='x')return;
    cur=clamp(base+dx,-132,0);
    slide.style.transform='translateX('+cur+'px)';
  });
  const settle=e=>{
    if(sx==null)return;
    slide.classList.remove('drag');
    const moved=Math.abs(e.clientX-sx)>6||Math.abs(e.clientY-sy)>6;
    if(lock==='x'){
      if(cur<-60){slide.style.transform='translateX(-132px)';openRow=slide;}
      else{slide.style.transform='';if(openRow===slide)openRow=null;}
    }else if(!moved){
      if(openRow)closeOpenRow();
      else editEntrySheet(en);
    }
    sx=null;lock=null;
  };
  slide.addEventListener('pointerup',settle);
  slide.addEventListener('pointercancel',()=>{
    slide.classList.remove('drag');
    slide.style.transform=(openRow===slide)?'translateX(-132px)':'';
    sx=null;lock=null;
  });
  return row;
}

/* ================= Open Food Facts client =================
   Barcode lookups use api/v2/product/<code>; free-text search uses the
   classic cgi/search.pl JSON endpoint (v2 has no free-text parameter).
   EVERY product that comes back is cached into the foods store keyed
   'off:<barcode>', so repeat scans/searches work fully offline. */
const OFF_FIELDS='code,product_name,brands,nutriments,serving_size,serving_quantity,image_small_url,nutriscore_grade,nova_group,additives_tags';
function netSet(off){S.offline=off;document.body.classList.toggle('off',off);}
async function offFetch(url){
  const ac=new AbortController();
  const tid=setTimeout(()=>ac.abort(),8000);
  try{
    const r=await fetch(url,{signal:ac.signal});
    netSet(false);
    return r;
  }catch(e){
    // header chip = "this device is offline"; an OFF server outage is
    // reported inline by the caller instead, so the chip never lies
    netSet(!navigator.onLine);
    throw e;
  }
  finally{clearTimeout(tid);}
}
function parseGramsFromLabel(s){
  if(!s)return null;
  const m=String(s).match(/([\d.]+)\s*(g|ml)\b/i);   // treats ml≈g (fine for logging)
  return m?parseFloat(m[1]):null;
}
// OFF product JSON → our food record (null if unusable: no name / no macros)
function offToFood(prod){
  if(!prod||!prod.code)return null;
  const name=(prod.product_name||'').trim();
  if(!name)return null;
  const n=prod.nutriments||{};
  let kcal=n['energy-kcal_100g'];
  if(kcal==null&&n['energy_100g']!=null)kcal=n['energy_100g']/4.184;  // kJ fallback
  const mg=v=>Math.round((+v||0)*100000)/100;   // OFF stores nutrients in g → mg
  const ug=v=>Math.round((+v||0)*1e8)/100;      // g → µg (vitamins A/D/B12, folate)
  let p100=null;
  if(kcal!=null||n.proteins_100g!=null||n.carbohydrates_100g!=null){
    p100={...ZERO,kcal:+kcal||0,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,
      f:+n.fat_100g||0,satf:+n['saturated-fat_100g']||0,
      fib:+n.fiber_100g||0,sug:+n.sugars_100g||0,
      sod:mg(n.sodium_100g),iron:mg(n.iron_100g),k:mg(n.potassium_100g),
      ca:mg(n.calcium_100g),mag:mg(n.magnesium_100g),zn:mg(n.zinc_100g),
      vita:ug(n['vitamin-a_100g']),vitc:mg(n['vitamin-c_100g']),
      vitd:ug(n['vitamin-d_100g']),vite:mg(n['vitamin-e_100g']),
      b12:ug(n['vitamin-b12_100g']),fol:ug(n['folates_100g']!=null?n['folates_100g']:n['vitamin-b9_100g']),
      caff:mg(n.caffeine_100g)};
  }
  let servG=parseFloat(prod.serving_quantity)||parseGramsFromLabel(prod.serving_size);
  let servLabel=(prod.serving_size||'').trim();
  let per=null;
  if(!p100){
    // per-serving-only products (some OFF entries lack per-100g data)
    if(n['energy-kcal_serving']==null)return null;
    per={...ZERO,kcal:+n['energy-kcal_serving']||0,p:+n.proteins_serving||0,
      c:+n.carbohydrates_serving||0,f:+n.fat_serving||0,
      satf:+n['saturated-fat_serving']||0,
      fib:+n.fiber_serving||0,sug:+n.sugars_serving||0,
      sod:mg(n.sodium_serving),iron:mg(n.iron_serving),k:mg(n.potassium_serving),
      ca:mg(n.calcium_serving),mag:mg(n.magnesium_serving),zn:mg(n.zinc_serving),
      vita:ug(n['vitamin-a_serving']),vitc:mg(n['vitamin-c_serving']),
      vitd:ug(n['vitamin-d_serving']),vite:mg(n['vitamin-e_serving']),

    const e=new Error('USDA '+r.status);
    e.rate=r.status===429;   // DEMO_KEY is 30 req/hour — tell the UI
    throw e;
  }
  const j=await r.json();
  const out=[];
  for(const x of j.foods||[]){
    const f=fdcToFood(x);
    if(f)out.push(await cacheOffFood(f));
  }
  return out;
}
/* result relevance: OFF's text search returns loosely-related products
   ("ketchup" → ketchup-flavour crisps), so the merged list is re-ranked by
   how much of the QUERY the food's name actually explains, with ties
   broken toward generic (unbranded) records and exact/prefix name hits. */
function searchRank(q,f){
  const qt=[...new Set(matchToks(q))];       // recipe-matcher tokens/stemming
  if(!qt.length)return 0;
  const ftArr=matchToks(f.name+' '+(f.brand||''));
  if(!ftArr.length)return 0;
  const fset=new Set(ftArr);
  const qlen=qt.reduce((a,t)=>a+t.length,0);
  let hit=0;
  for(const t of qt)if(fset.has(t))hit+=t.length;
  const qCov=qlen?hit/qlen:0;                // how much of the QUERY matched
  /* …and how much of the FOOD's own name the query explains. Without this
     term "Ketchup Flavour Crisps" outranks "Tomato Ketchup" on a prefix
     bonus — the extra words are things the user never asked for. Mirrors
     the coverage scoring matchFood uses for recipe imports. */
  const flen=ftArr.reduce((a,t)=>a+t.length,0);
  let fhit=0;
  for(const t of fset)if(qt.includes(t))fhit+=t.length;
  let s=qCov*.72+(flen?fhit/flen:0)*.28;
  const nlow=f.name.toLowerCase(),ql=q.trim().toLowerCase();
  if(nlow===ql)s+=.25;else if(nlow.startsWith(ql))s+=.08;
  if(!f.brand)s+=.05;                        // generic beats branded on ties
  if(f.per&&f.per.kcal>0)s+=.02;             // has usable energy data
  return s;
}
/* v2.3 search: OFF and USDA queried in PARALLEL and merged — OFF alone is
   weak on whole/homemade foods (its strength is barcoded products) while
   USDA covers generic + prepared dishes; ranked together the gaps close.
   Either side may fail (OFF outages, USDA rate limits) without killing
   the search — only both failing surfaces an error. */
async function netSearch(q){
  const[off,fdc]=await Promise.allSettled([offSearch(q),fdcSearch(q)]);
  const okOff=off.status==='fulfilled',okFdc=fdc.status==='fulfilled';
  if(!okOff&&!okFdc){
    // keep the USDA rate-limit fact visible even when OFF's error wins
    const e=off.reason||fdc.reason;
    e.fdcRate=!!(fdc.reason&&fdc.reason.rate);
    throw e;
  }
  const merged=[],seenId=new Set(),seenName=new Set();
  const push=f=>{
    const nk=(f.name+'|'+(f.brand||'')).toLowerCase();
    if(seenId.has(f.id)||seenName.has(nk))return;
    seenId.add(f.id);seenName.add(nk);merged.push(f);
  };
  // OFF first: when the same product exists in both (matched by barcode or
  // name+brand), the OFF copy wins — it carries Nutri-Score + additives
  if(okOff)for(const f of off.value)push(f);
  if(okFdc)for(const f of fdc.value){
    if(f.barcode&&seenId.has('off:'+f.barcode))continue;
    push(f);
  }
  const ranked=merged.map(f=>[searchRank(q,f),f])
    .sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  return {results:ranked.slice(0,30),off:okOff,fdc:okFdc,
    fdcRate:!okFdc&&!!(fdc.reason&&fdc.reason.rate)};
}
// cache an OFF record without clobbering anything the user touched
async function cacheOffFood(f){
  const ex=S.foods.get(f.id);
  if(ex){
    if(ex.edited)return ex;
    f.used=ex.used;f.lastUsed=ex.lastUsed;
  }
  await saveFood(f);
  return f;
}
async function offFetchProduct(code){
  let j=null;
  try{
    const r=await offFetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+OFF_FIELDS);
    j=await r.json();
  }catch(e){return {err:true};}
  if(!j||j.status!==1||!j.product)return {notFound:true};
  const f=offToFood(j.product);
  return f?{food:await cacheOffFood(f)}:{notFound:true};
}
async function offSearch(q){
  // OFF's legacy text search (search.pl) is periodically down (503s);
  // fall back to Search-a-licious, whose hits carry the same fields.
  let products=null;
  try{
    const r=await offFetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+
      encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=24&fields='+OFF_FIELDS);
    const j=await r.json();
    if(Array.isArray(j.products))products=j.products;
  }catch(e){}
  if(!products){
    const r=await offFetch('https://search.openfoodfacts.org/search?q='+
      encodeURIComponent(q)+'&page_size=24&fields='+OFF_FIELDS);
    const j=await r.json();
    products=j.hits||[];
  }
  const out=[];
  for(const p of products){
    const f=offToFood(p);
    if(f)out.push(await cacheOffFood(f));
  }
  return out;
}

/* meal-aware shortlists (v2.3): "Recent" used to be globally newest-first,
   so opening Add at breakfast led with last night's dinner. Both lists now
   rank foods by their history WITHIN the target meal slot (S.addCtx meal,
   or the time-of-day guess), derived straight from diary entries — no
   schema change — then top up with the global ordering so young libraries
   never show an emptier screen than before. */
function targetMeal(){return (S.addCtx&&S.addCtx.meal)||mealGuess();}
function mealRecents(mk,n){
  const ts=new Map();   // foodId → newest entry ts in this meal slot
  for(const e of S.entries)
    if(e.meal===mk&&(ts.get(e.foodId)||0)<e.ts)ts.set(e.foodId,e.ts);
  const out=[...ts.entries()].sort((a,b)=>b[1]-a[1])
    .map(([id])=>S.foods.get(id)).filter(f=>f&&!f.hidden).slice(0,n);
  if(out.length<n){   // pad with global recents (they sort BELOW meal hits)
    const have=new Set(out.map(f=>f.id));
    for(const f of [...S.foods.values()].filter(f=>!f.hidden&&f.lastUsed>0)
        .sort((a,b)=>b.lastUsed-a.lastUsed)){
      if(out.length>=n)break;
      if(!have.has(f.id))out.push(f);
    }
  }
  return out;
}
function mealFrequents(mk,n){
  const cnt=new Map();
  for(const e of S.entries)if(e.meal===mk)cnt.set(e.foodId,(cnt.get(e.foodId)||0)+1);
  const out=[...cnt.entries()].filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1])
    .map(([id])=>S.foods.get(id)).filter(f=>f&&!f.hidden).slice(0,n);
  if(out.length<n){
    const have=new Set(out.map(f=>f.id));
    for(const f of [...S.foods.values()].filter(f=>!f.hidden&&(f.used||0)>=2)
        .sort((a,b)=>b.used-a.used)){
      if(out.length>=n)break;
      if(!have.has(f.id))out.push(f);
    }
  }
  return out;
}
