function onSearchInput(q){
  clearTimeout(SEARCH_T);
  q=q.trim();
  if(q.length<2){renderAddHome();return;}
  SEARCH_T=setTimeout(()=>doSearch(q),420);   // debounced live search

async function doSearch(q){
  const seq=++S.searchSeq;
  const box=$('#add-results');
  if(!box)return;
  box.innerHTML='';
  const ql=q.toLowerCase();
  const local=[...S.foods.values()].filter(f=>!f.hidden&&
      (f.name.toLowerCase().includes(ql)||(f.brand||'').toLowerCase().includes(ql)))
    .sort((a,b)=>{
      const as=a.name.toLowerCase().startsWith(ql)?0:1,bs=b.name.toLowerCase().startsWith(ql)?0:1;
      return as-bs||(b.used||0)-(a.used||0);
    }).slice(0,10);
  if(local.length){
    const card=h('div',{class:'listcard'});
    for(const f of local){
      const tag=f.src==='custom'?['MINE','mine']:f.src==='off'?['OFF','off']:null;
      card.append(foodRowBtn(f,tag,()=>openLogSheet(f)));
    }
    box.append(addSec('Your library'),card);
  }
  const offBox=h('div',{class:'listcard'},h('div',{class:'skel'}),h('div',{class:'skel'}),h('div',{class:'skel'}));
  const srcHead=addSec('Searching…');
  box.append(srcHead,offBox);
  let res=null,failed=false,failRate=false;
  try{res=await netSearch(q);}catch(e){failed=true;failRate=!!e.fdcRate;}
  if(seq!==S.searchSeq)return;   // a newer search superseded this one
  offBox.innerHTML='';
  if(failed){
    srcHead.querySelector('h4').textContent='Online search';
    offBox.append(h('div',{class:'searchmsg'},
      h('div',{class:'serif'},'No food database answered'),
      h('p',{},(S.offline?'You’re offline'
        :failRate?'Open Food Facts is unreachable and USDA is rate-limited (a free API key in Settings → Data lifts that)'
        :'Open Food Facts and USDA are both unreachable right now')+
        ' — your library, cached scans, barcode lookups and custom foods still work.')));
    return;
  }
  srcHead.querySelector('h4').textContent=
    res.off&&res.fdc?'Open Food Facts + USDA'
    :res.off?'Open Food Facts':'USDA FoodData Central';
  const seen=new Set(local.map(f=>f.id));
  const tagOf=f=>f.src==='fdc'?['USDA','fdc']:['OFF','off'];
  let shown=0;
  for(const f of res.results){
    if(seen.has(f.id))continue;
    offBox.append(foodRowBtn(S.foods.get(f.id)||f,tagOf(f),()=>openLogSheet(S.foods.get(f.id)||f)));
    shown++;
  }
  if(!shown)offBox.append(h('div',{class:'searchmsg'},
    h('div',{class:'serif'},'No matches'),
    h('p',{},'Try a simpler name, scan the barcode, or create it as a custom food.')));
  // one database silently down? say so, quietly (results above still stand)
  if(res.fdcRate)box.append(h('p',{class:'tiny dim',style:'margin:8px 2px'},
    'USDA is rate-limited right now — a free API key (Settings → Data) lifts the shared limit.'));
  else if(!res.fdc)box.append(h('p',{class:'tiny dim',style:'margin:8px 2px'},
    'USDA didn’t answer — showing Open Food Facts only.'));
  else if(!res.off)box.append(h('p',{class:'tiny dim',style:'margin:8px 2px'},
    'Open Food Facts didn’t answer — showing USDA only.'));
}

function openLogSheet(food,ctx,existing){
  ctx=ctx||S.addCtx||{date:todayStr(),meal:mealGuess()};
  let amt=existing?existing.amt:1;
  let unit=existing?existing.unit:'serv';
  let meal=ctx.meal||mealGuess();
  const date=ctx.date||todayStr();
  const preview=h('div',{class:'row',style:'justify-content:center;gap:14px;margin:4px 0 2px'});
  const amtIn=h('input',{class:'num',inputmode:'decimal',value:String(amt),oninput:e=>{amt=Math.max(numOr(e.target.value,0),0);upd(false);}});
  function upd(setInput){
    const m=unit==='g'&&food.p100?scaleMac(food.p100,amt/100):scaleMac(food.per,amt);
    // macro-math reporting: kcal recomputed from P/C/F, flagged when the
    // label energy disagrees noticeably (usually rounding or fibre policy)
    const mm=Math.round(m.p*4+m.c*4+m.f*9);
    const off15=m.kcal>20&&Math.abs(mm-m.kcal)/m.kcal>.15;
    preview.innerHTML='<div style="text-align:center"><div class="num" style="font-size:30px;font-weight:800;letter-spacing:-.5px">'+kc(m.kcal)+'<span class="dim" style="font-size:13px;font-weight:600"> kcal</span></div>'+
      '<div class="mch" style="font-size:13px;gap:12px;justify-content:center"><span class="p">P <b>'+g1(m.p)+'g</b></span><span class="c">C <b>'+g1(dispC(m))+'g</b></span><span class="f">F <b>'+g1(m.f)+'g</b></span></div>'+
      '<div class="tiny dim" style="margin-top:5px">Macro math: '+mm+' kcal'+(off15?' — label differs ⚠️':'')+'</div></div>';
    renderNut(m);
    if(setInput)amtIn.value=String(Math.round(amt*100)/100);
  }
  /* full nutrient table for the CURRENT amount — micros per food at last
     (values track the stepper live; % column = share of the daily target) */
  const nutBox=h('div',{style:'display:none;margin-top:4px'});
  const nutBtn=h('button',{class:'btn sm mt8',onclick:()=>{
    const show=nutBox.style.display==='none';
    nutBox.style.display=show?'':'none';
    nutBtn.textContent=show?'Hide full nutrition ▴':'Full nutrition & micros ▾';
  }},'Full nutrition & micros ▾');
  function renderNut(m){
    if(nutBox.style.display==='none'&&!nutBox.childElementCount)return; // lazy first fill
    nutBox.innerHTML='';
    const mk=(label,txt,ref,sub)=>h('div',{class:'nutrow'+(sub?' sub':'')},
      h('span',{class:'nl'},label),h('span',{class:'nv num'},txt),h('span',{class:'nr num'},ref||''));
    nutBox.append(
      mk('Calories',kc(m.kcal)+' kcal'),
      mk('Protein',g1(m.p)+' g'),
      mk(carbLbl(),g1(dispC(m))+' g'),
      mk('Sugars',g1(m.sug)+' g',null,true),
      mk('Fibre',g1(m.fib)+' g',null,true),
      mk('Fat',g1(m.f)+' g'),
      mk('Saturated',g1(m.satf)+' g',null,true));
    for(const[key,label,unit,,,isLimit]of MICROS){
      const v=m[key]||0,ref=microRDA(key);
      nutBox.append(mk(label,g1(v)+' '+unit,
        ref>0?Math.round(v/ref*100)+'%'+(isLimit?' limit':' RDA'):''));
    }
    nutBox.append(h('p',{class:'tiny dim',style:'margin-top:6px'},
      '0 usually means “not declared on the label”, not truly zero.'));
  }
  nutBtn.addEventListener('click',()=>{if(nutBox.style.display!=='none'&&!nutBox.childElementCount)upd(false);});
  /* additive verdict for this food (Yuka-style risk classes) */
  function addSection(){
    const sc=addScore(food);

      ?h('p',{class:'tiny dim',style:'margin-top:10px'},
        '⚗️ No additive data cached yet — search or scan this product once while online to fetch it.')

        '⚗️ Additives unknown — use “Edit this food” below to declare them.')

    }

      'NOVA group 4 — classed as ultra-processed by Open Food Facts.'));

  }
  const step=d=>{const inc=unit==='g'?(d>0?10:-10):(d>0?.5:-.5);amt=Math.max(Math.round((amt+inc)*100)/100,0);upd(true);};

  if(subRow.children.length)body.append(subRow);

  body.append(preview);
  if(food.p100&&food.servG){
    body.append(labeled('Amount in',seg([['serv','Servings'],['g','Grams']],unit,v=>{
      // convert the current quantity so the logged amount is unchanged

      close();

    const del=h('button',{class:'btn danger sm mt8',onclick:async()=>{

    if(existing){

/* ---------- suspicious-value detection ----------
   Database records are crowd-sourced and sometimes plainly wrong (a sodium
   figure entered in mg-per-serving into a g-per-100g field reads as ~64 g
   of salt; energy drinks routinely declare no caffeine). We can't fix the
   upstream data, but we can spot the implausible cases and point at the
   Tweak flow rather than letting a bad number silently poison a day. */
function foodWarnings(f){
  const out=[];
  const b=f.p100||f.per;
  if(!b)return out;
  const per100=!!f.p100;
  const cap=(v,lim)=>v>lim;
  if(per100){
    if(cap(b.sod,12000))out.push('Sodium reads '+g1(b.sod/1000)+' g per 100 g (≈'+g1(b.sod*2.5/1000)+' g salt) — almost certainly a data error.');
    if(cap(b.p,95)||cap(b.c,105)||cap(b.f,100))out.push('A macro exceeds 100 g per 100 g — the label data is inconsistent.');
    const mm=b.p*4+b.c*4+b.f*9;
    if(b.kcal>30&&mm>0&&Math.abs(mm-b.kcal)/b.kcal>.35)
      out.push('Calories ('+kc(b.kcal)+') disagree with the macros ('+kc(mm)+' kcal) by more than a third.');
    if(b.kcal>900)out.push('Over 900 kcal per 100 g — higher than pure fat, so something is off.');
  }
  // caffeine: flag drinks that clearly should declare it but report zero
  if(!b.caff&&/energy drink|monster|red bull|espresso|coffee|cola|matcha/i.test(f.name+' '+(f.brand||'')))
    out.push('No caffeine declared — most products like this contain some. Worth correcting.');
  return out;
}
/* ---------- custom food creator / editor ---------- */

   it); the diary entry in hand, if any, is repointed at the fixed copy. */
function tweakFoodSheet(src,ctx,existing){
  const draft={...src,
    id:'c'+uid(),src:'custom',
    name:src.name,brand:src.brand||'',
    per:{...ZERO,...(src.per||{})},
    p100:src.p100?{...ZERO,...src.p100}:null,
    servLabel:src.servLabel||'1 serving',servG:src.servG||null,
    thumb:src.thumb||null,barcode:src.barcode||null,

    // it and let the estimator re-grade; additive/NOVA facts still hold
    ns:null,nova:src.nova||null,adds:Array.isArray(src.adds)?[...src.adds]:src.adds??null,
    ts:Date.now(),used:0,lastUsed:0,hidden:0,edited:0};

      existing.foodId=saved.id;

/* ================= pasted nutrition estimates (v3.2) =================
   The workflow this exists for: photograph a food, ask an assistant for a
   breakdown, copy its reply, paste it here. NOT an AI integration —
   nothing leaves the device and no key is needed. This is a text parser
   plus a review screen, so it works offline and takes text from any
   source (an assistant's reply, a label typed out, a website).

   The canonical payload is a fenced block:

     ```macrolog
     Food: Ben & Jerry's Cookie Dough
     Brand: Ben & Jerry's
     Serving: 1 scoop (100 g)
     Basis: per serving
     Calories: 260 kcal
     Protein: 4 g
     ...
     Additives: E322, E471
     ```

   …but the parser is deliberately forgiving, because what actually gets
   pasted is a WHOLE chat reply wrapped in prose, markdown bold, headings
   and sometimes a table. It reads bare "Protein 12 g" lines, markdown
   tables, JSON, UK "of which" labels, kJ-only energy, salt instead of
   sodium, ranges ("250–300 kcal" → midpoint), %DV figures, and additives
   written as names rather than E-numbers. Anything it could not use is
   reported on screen rather than dropped silently — an estimate that
   quietly loses half its micros is worse than one that says so. */
const EST_UNIT={kcal:'kcal',p:'g',c:'g',f:'g',satf:'g',fib:'g',sug:'g',sod:'mg',
  iron:'mg',k:'mg',ca:'mg',mag:'mg',zn:'mg',vita:'ug',vitc:'mg',vitd:'ug',
  vite:'mg',b12:'ug',fol:'ug',caff:'mg'};
const EST_LBL={kcal:'Calories',p:'Protein',c:'Carbs',f:'Fat',satf:'Saturated fat',
  fib:'Fibre',sug:'Sugar',sod:'Sodium',iron:'Iron',k:'Potassium',ca:'Calcium',
  mag:'Magnesium',zn:'Zinc',vita:'Vitamin A',vitc:'Vitamin C',vitd:'Vitamin D',
  vite:'Vitamin E',b12:'Vitamin B12',fol:'Folate',caff:'Caffeine'};
/* FDA Daily Values — used ONLY to expand a "%DV" figure into an amount,
   which some breakdowns give instead of milligrams. Always reported. */
const EST_DV={p:50,c:275,f:78,satf:20,fib:28,sug:50,sod:2300,iron:18,k:4700,
  ca:1300,mag:420,zn:11,vita:900,vitc:90,vitd:20,vite:15,b12:2.4,fol:400};
/* → mg. BOTH mu codepoints: U+00B5 MICRO SIGN and U+03BC GREEK SMALL
   LETTER MU look identical and are used interchangeably in the wild. */
const EST_MASS={g:1e3,gram:1e3,grams:1e3,mg:1,milligram:1,milligrams:1,
  ug:1e-3,'µg':1e-3,'μg':1e-3,mcg:1e-3,microgram:1e-3,micrograms:1e-3};
/* label → field. Whichever alias is mentioned EARLIEST in the label wins,
   so "Carbs, of which sugars" reads as carbs while a bare "of which
   sugars" reads as sugar, and "saturated fat" never reads as fat. */
const EST_KEYS=[
  [/\bfoods?\b|\bnames?\b|\bproducts?\b|\bitems?\b|\btitle\b|\bdish\b/,'name'],
  [/brand|manufacturer/,'brand'],
  [/serving|portion|\bamount\b|\bweight\b/,'serving'],
  [/\bquantity\b|\bqty\b|\bhow much\b|\beaten\b|\bi ate\b/,'qty'],
  [/\bbasis\b|values?\s*per|data\s*per|figures\s*per/,'basis'],
  [/calorie|energy|kcal|\bcals?\b/,'kcal'],
  [/protein/,'p'],
  [/carb/,'c'],
  [/satur|\bsat[\s-]?fats?\b|\bsat\b/,'satf'],
  [/\bfats?\b|lipid/,'f'],
  [/fib(re|er)/,'fib'],
  [/sugar/,'sug'],
  [/\bsalt\b/,'salt'],
  [/sodium/,'sod'],
  [/iron/,'iron'],
  [/potassium/,'k'],
  [/calcium/,'ca'],
  [/magnesium/,'mag'],
  [/zinc/,'zn'],
  [/vitamin\s*a\b|retinol/,'vita'],
  [/vitamin\s*c\b|ascorbic/,'vitc'],
  [/vitamin\s*d\b|calciferol/,'vitd'],
  [/vitamin\s*e\b|tocopherol/,'vite'],
  [/\bb-?\s*12\b|cobalamin/,'b12'],
  [/folate|folic|\bb-?\s*9\b/,'fol'],
  [/caffeine/,'caff'],
  [/additive|e-?numbers?/,'adds'],
  [/ingredient/,'ingr'],
  [/\bnova\b/,'nova'],
  [/nutri-?\s*score|nutrition\s*grade/,'grade'],
  [/confidence|certainty/,'conf'],
  [/\bnotes?\b|caveat|assumption|disclaimer/,'note'],

function estKey(label){
  let best=null,bi=1e9,bo=1e9;
  EST_KEYS.forEach(([re,k],i)=>{
    const m=label.match(re);
    if(!m)return;
    if(m.index<bi||(m.index===bi&&i<bo)){best=k;bi=m.index;bo=i;}
  });
  return best;
}
/* headings that label a section of the reply rather than name a food */
const EST_SECTION=/^(macros?|macronutrients?|micros?|micronutrients?|nutrition(al)?( info(rmation)?| facts| breakdown)?|nutrients?|vitamins?( ?(and|&) ?minerals?)?|minerals?|additives?|e-?numbers?|ingredients?|notes?|caveats?|assumptions?|summary|breakdown|totals?|estimates?|disclaimers?|confidence|allergens?|per serving|per 100 ?g)$/i;
/* how much of the portion was eaten: 0.5, 1/2, 50%, "half", "half of it" */
/* multi-word keys first: the lookup is prefix-anchored, so 'two' must not
   shadow 'two thirds' */
const EST_FRAC={'two thirds':2/3,'two third':2/3,'three quarters':.75,
  'three quarter':.75,half:.5,third:1/3,quarter:.25,whole:1,all:1,none:0,
  one:1,two:2,three:3,four:4};
function estQty(rawv){
  let s=estTxt(rawv).toLowerCase()
    .replace(/^(i\s+ate|ate|had|eaten|consumed|about|approx\.?|roughly)\s+/,'')
    .replace(/^(a|an|one)\s+(?=(half|third|quarter))/,'')
    .replace(/\b(of\s+)?(a\s+|the\s+|one\s+)?(serving|portion|plate|bowl|pack|packet|it|this)s?\b/g,' ')
    .replace(/[.,;]$/,'').replace(/\s+/g,' ').trim();
  if(!s)return null;
  const frac=s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
  if(frac&&+frac[2])return +frac[1]/+frac[2];
  const pct=s.match(/^(\d+(?:\.\d+)?)\s*%$/);
  if(pct)return +pct[1]/100;
  for(const[k,v]of Object.entries(EST_FRAC))if(new RegExp('^'+k+'\\b').test(s))return v;
  const n=parseFloat(s.replace(',','.'));
  return isNaN(n)?null:n;
}
const estTxt=s=>String(s).replace(/[*_`]/g,'').replace(/\s+/g,' ').trim();
/* g1() rounds 0.005 to "0" — fine on a tile, useless in a sentence that
   explains what a number was converted from. */
const estFmt=v=>{
  v=+v;
  if(!isFinite(v))return '0';
  const a=Math.abs(v);
  return String(a>=100?Math.round(v):a>=1?Math.round(v*10)/10:Math.round(v*1000)/1000);
};
/* one number out of "≈250–300 kcal" / "1,090 kJ (260 kcal)" / "0,5 g" /
   "<0.5 g" / "12 %DV". A range collapses to its midpoint — once it is in
   the diary it has to be one number — and the caller reports that it did. */
function estVal(raw){
  const s=estTxt(raw);
  if(!s||!/\d/.test(s))return null;
  if(/^(n\/?a|unknown|none|nil|trace|negligible)\b/i.test(s))return null;
  const t=s.replace(/(\d),(?=\d{3}(\D|$))/g,'').replace(/(\d),(\d)/g,'$1.$2');
  /* "%" carries no word boundary after it, so it is matched separately —
     matching it inside the unit list silently dropped every %DV figure. */
  const pairs=[...t.matchAll(/(\d+(?:\.\d+)?)\s*(kcal|calories|cal|kj|[µμ]g|ug|mcg|mg|grams|gram|g)(?![a-z])/gi)]
    .map(m=>[+m[1],m[2].toLowerCase()]);
  const pct=/(\d+(?:\.\d+)?)\s*%/.exec(t);
  const first=t.match(/\d+(?:\.\d+)?/);
  if(!first)return null;
  let v=+first[0],unit=pairs.length?pairs[0][1]:(pct?'%':null),range=null;
  const rm=t.match(/(\d+(?:\.\d+)?)\s*(?:-|–|—|\bto\b)\s*(\d+(?:\.\d+)?)/);
  if(rm&&+rm[1]!==+rm[2]){
    range=[+rm[1],+rm[2]];v=(range[0]+range[1])/2;
    if(pairs.length)unit=pairs[pairs.length-1][1];
  }else if(pairs.length)v=pairs[0][0];
  else if(pct)v=+pct[1];
  // "1090 kJ (260 kcal)" — the kilocalorie figure is the one we want
  const kcp=pairs.find(p=>/^(kcal|cal|calories)$/.test(p[1]));
  if(kcp&&pairs.some(p=>p[1]==='kj')&&!range){v=kcp[0];unit=kcp[1];}

  if(/^(unknown|not\s|unclear|unable)/i.test(s))return {list:null,rep};

  if(keyed.length)t=keyed.join('\n---\n');   // canonical payload — ignore the prose

    /* Copying the code block itself rather than the whole reply strips the

       block minus its wrapper — claiming we found no block would be wrong. */
    if(!/^\s*(food|name|product|item|dish)\s*:/i.test(t))

  }

  const flush=()=>{if(cur&&cur.rows.length)blocks.push(cur);cur=null;};

      if(!cells.length||cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;
      if(cells.length<2)continue;

/* The same estimate pasted twice shouldn't fork the library — reuse the
   existing record when the numbers match, so history stays on one id. */
function estDedupe(f){
  const nm=(f.name||'').toLowerCase().trim(),br=(f.brand||'').toLowerCase().trim();
  const near=(p,q,tol)=>Math.abs((p||0)-(q||0))<=tol;
  for(const x of S.foods.values()){
    if(x.src!=='custom'||x.id===f.id)continue;
    if((x.name||'').toLowerCase().trim()!==nm)continue;
    if((x.brand||'').toLowerCase().trim()!==br)continue;
    if((x.servG||0)!==(f.servG||0))continue;
    const a=x.per||ZERO,b=f.per||ZERO;
    if(near(a.kcal,b.kcal,2)&&near(a.p,b.p,.6)&&near(a.c,b.c,.6)&&near(a.f,b.f,.6))return x;
  }
  return null;
}

/* recipe importer: paste ingredient lines → parse quantities → best-effort
   match against the local library → hand off to the meal builder */
function parseIngredient(line){
  line=line.replace(/^[-*•\d]+[.)]\s*/,'').trim();
  if(!line)return null;
  let m=line.match(/^([\d.,]+)\s*(g|grams?|ml|kg)\b\s*(?:of\s+)?(.+)$/i);
  if(m){
    let amt=parseFloat(m[1].replace(',','.'));
    if(/kg/i.test(m[2]))amt*=1000;
    return {amt,unit:'g',name:m[3].trim()};
  }
  m=line.match(/^(\d+\/\d+|[\d.,]+)\s*(?:x|×)?\s+(.+)$/);
  if(m){
    let amt=m[1].includes('/')
      ?(+m[1].split('/')[0]/+m[1].split('/')[1])
      :parseFloat(m[1].replace(',','.'));
    return {amt:amt||1,unit:'serv',name:m[2].trim()};
  }
  return {amt:1,unit:'serv',name:line};
}
/* ingredient matching, v2.2 — exact stemmed tokens + coverage scoring.
   The old substring scorer let "chicken breast" resolve to "Breaded Chicken
   Fillets" (any partial hit counted). Now: prep words are ignored, tokens
   are singularised, MOST of the query must match (qCov ≥ .55, so "breast"
   can't silently miss), and candidates whose names are mostly unexplained
   extra words rank below plain whole foods. No match → honest "pick one". */
const MATCH_STOP=new Set(['fresh','raw','ripe','large','medium','small','big',
  'chopped','diced','sliced','grated','minced','shredded','crushed','finely',
  'roughly','thinly','peeled','deseeded','trimmed','optional','taste','pinch',
  'handful','extra','little','plain','boneless','skinless','lean','cooked',
  'boiled','baked','grilled','roasted','steamed','dry','frozen','tinned',
  'canned','drained','tin','tins','jar','pack','bag','cup','cups','tbsp','tsp',
  'tablespoon','tablespoons','teaspoon','teaspoons','clove','cloves','stick',
  'sticks','piece','pieces','the','and','with','into','about','some','few']);
const TOK_ALIAS={yoghurt:'yogurt',zucchini:'courgette',eggplant:'aubergine',
  shrimp:'prawn',garbanzo:'chickpea',capsicum:'pepper',scallion:'spring',
  cornflour:'corn',porridge:'oat'};
const stemTok=t=>{
  t=t.replace(/(sses|shes|ches|xes)$/,m=>m.slice(0,-2))
     .replace(/ies$/,'y').replace(/oes$/,'o').replace(/([^su])s$/,'$1');
  return TOK_ALIAS[t]||t;
};
const matchToks=s=>String(s).toLowerCase().split(/[^a-zà-ÿ]+/)
  .filter(t=>t.length>2&&!MATCH_STOP.has(t)).map(stemTok);
function matchFood(name){
  const toks=matchToks(name);
  if(!toks.length)return null;
  const qlen=toks.reduce((a,t)=>a+t.length,0),qset=new Set(toks);
  let best=null,bs=0;
  for(const f of S.foods.values()){
    if(f.hidden)continue;
    const ft=matchToks(f.name+' '+(f.brand||''));
    if(!ft.length)continue;
    const fset=new Set(ft);
    let match=0;
    for(const t of qset)if(fset.has(t))match+=t.length;
    if(!match)continue;
    const qCov=match/qlen;                 // how much of the QUERY is matched
    if(qCov<.55)continue;
    const flen=ft.reduce((a,t)=>a+t.length,0);
    let fmatch=0;
    for(const t of fset)if(qset.has(t))fmatch+=t.length;
    let s=qCov*.7+(fmatch/flen)*.3;        // penalise mostly-unexplained names
    if(f.src==='seed'||f.src==='custom')s+=.03;  // whole/own foods win ties
    s+=Math.min(f.used||0,20)*.002;              // gentle familiarity nudge
    if(s>bs){bs=s;best=f;}
  }
  return best;
}
function importRecipeSheet(){

    out.innerHTML='';

        h('div',{class:'fr-name'},p.food?p.food.name:'“'+p.name+'”'),

  const ctx=S.addCtx||{date:todayStr(),meal:mealGuess()};

  const t=mealMacros(m);
  const list=h('div',{class:'listcard mt8'});
  for(const it of m.items){
    const f=S.foods.get(it.foodId);
    const mm=f?(it.unit==='g'&&f.p100?scaleMac(f.p100,it.amt/100):scaleMac(f.per,it.amt)):{...ZERO};
    const mid=h('div',{class:'grow'},
      h('div',{class:'fr-name'},f?f.name:'?'),

    list.append(h('div',{class:'food-row'},mid,
      h('div',{class:'fr-kcal num'},h('b',{},kc(mm.kcal)),h('span',{},'kcal'))));
  }
  const logB=h('button',{class:'btn primary mt12'});
  const lbl=()=>{logB.textContent='Log all to '+MEAL_NAME[meal]+(ctx.date!==todayStr()?' · '+fmtDay(ctx.date):'');};
  logB.addEventListener('click',async()=>{

    m.used=(m.used||0)+1;m.lastUsed=Date.now();
    await dbPut('meals',m);

/* ---------- barcode scanner ----------
   Fast path: native BarcodeDetector (feature-detected). Fallback: ZXing
   via CDN, lazy-loaded only when the scanner first opens. getUserMedia
   needs a secure context (HTTPS or localhost) — over plain LAN http we
   fall back to typing the digits, which still hits the same lookup. */
const SCAN={stream:null,zx:null,det:null,on:false,done:false,
  track:null,torch:false,last:'',lastN:0,hintT:0};
/* EAN/UPC check digit — the last digit is a checksum over the others.
   Validating it locally lets a clean read be accepted instantly while
   forcing anything that fails (a partial or motion-blurred decode) to be
   seen twice before we trust it. That is most of "picky scanner" fixed:
   fewer false accepts AND a faster path for good reads. */
function validEAN(code){
  if(!/^\d+$/.test(code))return false;
  if(![8,12,13,14].includes(code.length))return false;
  const d=[...code].map(Number),chk=d.pop();
  let sum=0;
  // weights alternate 3/1 from the right-most data digit outwards
  for(let i=d.length-1,w=3;i>=0;i--,w=w===3?1:3)sum+=d[i]*w;
  return (10-(sum%10))%10===chk;
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=h('script',{src,onload:res,onerror:rej});
    document.head.append(s);
  });
}
async function openScanner(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    manualBarcodeSheet('Camera needs HTTPS (or localhost) — type the barcode digits instead:');
    return;
  }
  SCAN.on=true;SCAN.done=false;SCAN.last='';SCAN.lastN=0;
  $('#scanov').classList.add('open');
  $('#scan-torch').style.display='none';
  const manual=$('#scan-manual');
  manual.style.display='none';
  // stuck on a stubborn barcode? offer the typed fallback after a few seconds
  clearTimeout(SCAN.hintT);
  SCAN.hintT=setTimeout(()=>{if(SCAN.on)manual.style.display='';},5000);
  // ask for a high-res continuous-focus stream: the default 640×480 is the
  // single biggest reason small barcodes refuse to decode
  const want={facingMode:{ideal:'environment'},
    width:{ideal:1920},height:{ideal:1080},
    focusMode:{ideal:'continuous'},advanced:[{focusMode:'continuous'}]};
  try{
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:want,audio:false});
  }catch(e){
    try{  // some devices reject the ideal constraints outright
      SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    }catch(e2){
      closeScanner();
      manualBarcodeSheet('Camera unavailable ('+e2.name+') — type the barcode digits instead:');
      return;
    }
  }
  const vid=$('#scanvid');
  vid.srcObject=SCAN.stream;
  vid.setAttribute('autoplay','');
  await vid.play().catch(()=>{});
  // torch: Android/Chrome exposes it as a track capability; iOS does not,
  // so the button only appears where it actually works
  SCAN.track=SCAN.stream.getVideoTracks()[0]||null;
  SCAN.torch=false;
  try{
    const caps=SCAN.track&&SCAN.track.getCapabilities?SCAN.track.getCapabilities():{};
    if(caps&&caps.torch)$('#scan-torch').style.display='';
  }catch(e){}
  if(window.BarcodeDetector){
    try{
      const fmts=await BarcodeDetector.getSupportedFormats();
      if(fmts.includes('ean_13')){
        // widen the format list: UK/EU shelf labels and some own-brand packs
        // carry ITF-14 or Code-39 rather than EAN-13
        SCAN.det=new BarcodeDetector({formats:fmts.filter(f=>
          ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar','databar'].includes(f))});
        bdLoop();return;
      }
    }catch(e){}
  }
  try{
    if(!window.ZXingBrowser)await loadScript('https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js');
    const reader=new ZXingBrowser.BrowserMultiFormatReader();
    SCAN.zx=await reader.decodeFromStream(SCAN.stream,vid,res=>{
      if(res&&SCAN.on)handleCode(res.getText());
    });
  }catch(e){
    closeScanner();
    manualBarcodeSheet('Scanner library couldn’t load'+(S.offline?' (offline)':'')+' — type the digits instead:');
  }
}
function bdLoop(){
  if(!SCAN.on||!SCAN.det)return;
  SCAN.det.detect($('#scanvid')).then(codes=>{
    if(!SCAN.on)return;
    if(codes&&codes.length){handleCode(codes[0].rawValue);}
    if(SCAN.on)setTimeout(bdLoop,90);   // 2× the old sample rate
  }).catch(()=>setTimeout(()=>{if(SCAN.on)bdLoop();},250));
}
async function toggleTorch(){
  if(!SCAN.track)return;
  try{
    SCAN.torch=!SCAN.torch;
    await SCAN.track.applyConstraints({advanced:[{torch:SCAN.torch}]});
    const b=$('#scan-torch');
    b.textContent=SCAN.torch?'🔦 Torch on':'🔦 Torch';
    b.style.background=SCAN.torch?'#F2EFE7':'#1F1F24';
    b.style.color=SCAN.torch?'#16171B':'#fff';
  }catch(e){
    SCAN.torch=false;
    toast('This camera won’t let the torch turn on');
  }
}
function closeScanner(){
  SCAN.on=false;
  clearTimeout(SCAN.hintT);
  if(SCAN.zx){try{SCAN.zx.stop();}catch(e){}SCAN.zx=null;}
  SCAN.det=null;
  // turn the torch off before releasing the track, or it can stay lit
  if(SCAN.track&&SCAN.torch){try{SCAN.track.applyConstraints({advanced:[{torch:false}]});}catch(e){}}
  SCAN.torch=false;SCAN.track=null;
  if(SCAN.stream){for(const t of SCAN.stream.getTracks())t.stop();SCAN.stream=null;}
  const vid=$('#scanvid');
  if(vid)vid.srcObject=null;
  $('#scanov').classList.remove('open');
}
/* Accept on a valid checksum immediately; otherwise require the same code
   twice in a row. Blurred/partial decodes rarely repeat identically, so
   this removes the misreads without making good scans wait. */
function handleCode(raw){
  if(SCAN.done)return;
  const code=String(raw).replace(/\D/g,'');
  if(code.length<6)return;
  if(!validEAN(code)){
    if(SCAN.last===code)SCAN.lastN++;
    else{SCAN.last=code;SCAN.lastN=1;}
    if(SCAN.lastN<2)return;
  }
  SCAN.done=true;
  haptic();
  closeScanner();
  lookupBarcode(code);
}
function manualBarcodeSheet(msg){

async function lookupBarcode(code){
  const cached=S.foods.get('off:'+code);
  if(cached&&!cached.hidden){openLogSheet(cached);return;}   // offline-friendly repeat scan
  const wait=sheet('Looking up…',h('div',{style:'padding:26px 0'},h('div',{class:'spin'}),
    h('p',{class:'small dim',style:'text-align:center;margin-top:12px'},'Barcode '+code)));

    ?'Couldn’t reach Open Food Facts — you may be offline.'
    :'This barcode isn’t on Open Food Facts (or has no nutrition data).';

    h('p',{class:'small dim',style:'margin:0 2px 12px'},why),
    h('button',{class:'btn primary',onclick:()=>{close2();customFoodSheet(null,{barcode:code},f=>openLogSheet(f));}},'Create it as a custom food'),
    h('button',{class:'btn mt8',onclick:()=>{close2();openScanner();}},'Scan again'));
  const close2=sheet('Not found',body);
}

/* which foods delivered the most of a nutrient across the selected range */
function topSourcesCard(days){
  const opts=[['p','Protein','g'],['c','Carbs','g'],['f','Fat','g'],['satf','Sat. fat','g'],
    ['fib','Fibre','g'],['sug','Sugar','g'],
    ...MICROS.map(m=>[m[0],m[1],m[2]])];
  let cur='p';
  const card=h('div',{class:'card'},h('h3',{class:'serif'},'Top sources'));
  const sel=h('select',{class:'in',onchange:e=>{cur=e.target.value;fill();}});
  for(const[k,label]of opts)sel.append(h('option',{value:k},label));
  const list=h('div',{class:'mt8'});
  card.append(sel,list);
  function fill(){
    list.innerHTML='';
    const sums=new Map();
    let total=0;
    for(const ds of days)for(const en of entriesFor(ds)){
      const v=entryMacros(en)[cur]||0;
      if(v<=0)continue;
      sums.set(en.foodId,(sums.get(en.foodId)||0)+v);
      total+=v;
    }
    const top=[...sums.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
    const unit=opts.find(o=>o[0]===cur)[2];
    for(const[fid,v]of top){
      const f=S.foods.get(fid);
      list.append(h('div',{class:'microrow'},
        h('span',{class:'ml',style:'flex:0 0 118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)'},f?f.name:'?'),
        h('div',{class:'mbar'},h('div',{class:'mfill',style:'width:'+Math.max(Math.round(v/total*100),3)+'%'})),
        h('span',{class:'mv num'},g1(v)+' '+unit)));
    }
    if(!top.length)list.append(h('p',{class:'small dim',style:'margin-top:6px'},'Nothing logged in this range yet.'));
  }
  fill();
  return card;
}

/* ---------------- targets: Mifflin-St Jeor ----------------
   BMR = 10·kg + 6.25·cm − 5·age + (m:+5 / f:−161); TDEE = BMR × activity.
   Suggested macros: protein 2 g/kg, fat 0.9 g/kg, carbs = remaining kcal/4. */
function mifflin(prof){
  const s=prof.sex==='m'?5:-161;
  const bmr=10*prof.kg+6.25*prof.cm-5*prof.age+s;
  return {bmr,tdee:bmr*prof.act};
}
/* Macro split presets = share of total calories taken as FAT.
   Fat used to be a flat 0.9 g/kg with every remaining calorie dumped into
   carbs, which collapses at high intakes: an 85 kg very active teenager on
   a bulk got 77 g fat (18% of energy — under the 20–35% reference range)
   and 570–660 g carbs (65%, above the 45–65% range). Anchoring fat to a
   PERCENTAGE keeps the split sane at any calorie level. */
const SPLITS={balanced:.28,lowcarb:.35,highcarb:.22};
function suggestTargets(prof,goal,split){
  let kcal=mifflin(prof).tdee;
  if(goal==='cut')kcal*=.85;
  else if(goal==='bulk')kcal*=1.1;
  kcal=Math.round(kcal/10)*10;
  const p=Math.round(prof.kg*(goal==='cut'?2.2:2));   // protein/kg stays lean-mass led
  const fPct=SPLITS[split]||SPLITS.balanced;
  // …but never below ~0.8 g/kg, the floor usually cited for hormonal health
  const f=Math.max(Math.round(kcal*fPct/9),Math.round(prof.kg*.8));
  const c=Math.max(Math.round((kcal-p*4-f*9)/4),0);
  return {kcal,p,c,f};
}

function calcForm(onApply,applyLabel){
  const prof={...S.set.prof};

  const cmI=h('input',{class:'in num',inputmode:'decimal',value:String(prof.cm)});

  const actSel=h('select',{class:'in'});
  for(const[v,label]of ACTIVITIES)actSel.append(h('option',{value:String(v),selected:Math.abs(prof.act-v)<.01?'':null},label));

  const out=h('div',{class:'pastbanner num',style:'margin-top:14px'},'');

    out.textContent='Suggested: '+t.kcal+' kcal · P'+t.p+' C'+t.c+' F'+t.f;
    // show the energy split so an unbalanced target is obvious up front
    pct.textContent='That’s '+Math.round(t.p*4/t.kcal*100)+'% protein · '+
      Math.round(t.c*4/t.kcal*100)+'% carbs · '+Math.round(t.f*9/t.kcal*100)+'% fat'+
      ' — about '+g1(t.p/prof.kg)+' g protein and '+g1(t.f/prof.kg)+' g fat per kg.';
    return t;
  }
  for(const el of[ageI,cmI,kgI,actSel])el.addEventListener('input',calc);
  const form=h('div',{},
    h('div',{class:'grid2'},labeled('Age',ageI),
      labeled('Sex',seg([['m','Male'],['f','Female']],prof.sex,v=>{prof.sex=v;calc();}))),
    h('div',{class:'grid2 mt8'},labeled('Height (cm)',cmI),labeled('Weight (kg)',kgI)),
    labeled('Activity level',actSel),
    labeled('Goal',seg([['cut','Lose'],['maintain','Maintain'],['bulk','Gain']],goal,v=>{goal=v;calc();})),
    labeled('Macro split',seg([['balanced','Balanced'],['highcarb','More carbs'],['lowcarb','More fat']],
      split,v=>{split=v;calc();})),
    h('p',{class:'tiny dim',style:'margin:-4px 2px 0'},
      'Shifts fat between roughly 22% and 35% of calories; carbs take the rest. Pick “More fat” if huge carb totals are hard to eat.'),
    out,pct,
    h('button',{class:'btn primary mt12',onclick:()=>onApply(calc(),prof)},applyLabel));
  calc();
  return form;
}

  pg.append(h('div',{class:'card'},
    h('div',{class:'setrow'},h('h3',{class:'serif grow',style:'margin:0'},'Data safety'),dsPill),
    dsNote,dsBk,
    h('p',{class:'tiny dim',style:'margin:9px 2px 12px'},

  refreshSafety();

  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[['date','meal','food','brand','amount','unit',...Object.keys(ZERO)].join(',')];
  const sorted=[...S.entries].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
  for(const en of sorted){
    const f=S.foods.get(en.foodId),m=entryMacros(en);
    lines.push([en.date,q(MEAL_NAME[en.meal]||en.meal),q(f?f.name:'?'),q(f?f.brand||'':''),
      en.amt,en.unit,...Object.keys(ZERO).map(k=>Math.round((m[k]||0)*100)/100)].join(','));
  }
  const blob=new Blob([lines.join('\r\n')],{type:'text/csv'});
  const a=h('a',{href:URL.createObjectURL(blob),download:'macrolog-foodlog-'+todayStr()+'.csv'});
  document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  toast('Food log downloaded ('+sorted.length+' rows)');
}
/* A backup file is the only copy of this data that survives the browser deciding
   to clear the origin, so the date of the last one is tracked and surfaced
   (Settings → Data safety, plus the nag on Today). */
const backupFileName=()=>'macrolog-backup-'+todayStr()+'.json';
async function noteBackup(ts){
  BK.last=ts||Date.now();
  try{await kvPut('lastBackupAt',BK.last);}catch(e){}
}
async function downloadExport(){
  const blob=new Blob([JSON.stringify(buildExportData(),null,1)],{type:'application/json'});
  const a=h('a',{href:URL.createObjectURL(blob),download:backupFileName()});
  document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  await noteBackup();
  toast('Backup downloaded ('+fmtBytes(blob.size)+')');
  nagRefresh();
}
/* Feature-detected with canShare({files}) because Safari and desktop Chrome
   accept navigator.share but refuse file payloads — in practice this is an
   Android affordance. */
function canShareBackup(){
  try{return !!(navigator.canShare&&navigator.share&&
    navigator.canShare({files:[new File([new Blob(['{}'])],'t.json',{type:'application/json'})]}));
  }catch(e){return false;}
}
async function shareBackup(){
  try{
    const file=new File([JSON.stringify(buildExportData(),null,1)],backupFileName(),{type:'application/json'});
    if(!(navigator.canShare&&navigator.canShare({files:[file]}))){await downloadExport();return;}
    await navigator.share({files:[file],title:'MacroLog backup'});
    await noteBackup();
    toast('Backup shared ('+fmtBytes(file.size)+')');
    nagRefresh();
  }catch(err){
    if(err&&err.name==='AbortError')return;   // user dismissed the share sheet
    toast('Share failed: '+err.message,{dur:4000});
  }
}
const FOOD_DEF={src:'custom',barcode:null,brand:'',per:null,servLabel:'1 serving',
  servG:null,p100:null,thumb:null,ns:null,nova:null,adds:null,ts:0,used:0,lastUsed:0,hidden:0,edited:0,
  origin:null,estConf:null,estNote:null};
async function applyImport(data){
  if(!data||data.app!=='macrolog'||!Array.isArray(data.entries))
    throw new Error('Not a MacroLog backup file');
  await Promise.all([dbClear('foods'),dbClear('entries'),dbClear('meals'),dbClear('body')]);
  /* Per-record tolerance: one malformed row (hand-edited backup, a record
     missing its id) used to throw mid-restore and leave the device with a
     half-imported database. Bad rows are now skipped and counted, so the
     rest of the backup always lands. */
  let skipped=0;
  const put=async(store,rec,fix)=>{
    try{
      if(!rec||typeof rec!=='object'||!rec.id)throw new Error('no id');
      await dbPut(store,fix?fix(rec):rec);
    }catch(e){skipped++;}
  };
  // additive-schema rule: spread defaults so older backups gain new fields
  for(const f of data.foods||[])await put('foods',f,r=>derivePer({...FOOD_DEF,...r}));
  for(const e of data.entries||[])await put('entries',e,r=>({...r,
    amt:+r.amt||0,unit:r.unit==='g'?'g':'serv',ts:+r.ts||Date.now()}));
  for(const m of data.meals||[])await put('meals',m,r=>({...r,items:Array.isArray(r.items)?r.items:[]}));
  // kg coerced: a hand-edited backup can carry it as a string, which would
  // silently plot nothing on the weight chart
  for(const b of data.body||[])await put('body',b,r=>({...r,kg:+r.kg||0}));
  const inc=data.settings||{};
  S.set={...DEF,...inc,t:{...DEF.t,...(inc.t||{})},prof:{...DEF.prof,...(inc.prof||{})}};
  await kvPut('settings',S.set);
  await kvPut('notes',data.notes||{});
  await loadAll();
  applyTheme();
  /* The file just restored from IS a backup, and the file's own timestamp is how
     old it is — so date "last backup" from the export, not from now. A restored
     three-month-old file should still be nagged about, and a fresh phone should
     not be nagged the moment it finishes importing. */
  const exp=Date.parse(data.exported||'');
  await noteBackup(isNaN(exp)?Date.now():Math.min(exp,Date.now()));
  return {entries:S.entries.length,foods:(data.foods||[]).length,skipped};
}
/* auto-repeating daily foods: rules in settings.autoLog are logged once per
   day, the first time the app runs that day (supplements, staple breakfasts) */
async function applyAutoLog(){
  const today=todayStr();
  if(S.set.autoDate===today||!(S.set.autoLog||[]).length)return;
  // skip rules whose exact entry already exists today — e.g. the user
  // copied yesterday (which contained the auto-logged items) before the
  // day's auto-run fired; mirrors the dedupe in copyDaySheet
  const have=new Map();
  for(const e of entriesFor(today)){
    const k=e.foodId+'|'+e.meal+'|'+e.amt+'|'+e.unit;
    have.set(k,(have.get(k)||0)+1);
  }
  let n=0;
  for(const r of S.set.autoLog){
    if(!S.foods.get(r.foodId))continue;
    const k=r.foodId+'|'+r.meal+'|'+r.amt+'|'+r.unit;
    if((have.get(k)||0)>0){have.set(k,have.get(k)-1);continue;}
    await logEntry({date:today,meal:r.meal,foodId:r.foodId,amt:r.amt,unit:r.unit});
    n++;
  }
  S.set.autoDate=today;
  await saveSet();
  if(n)toast('⟳ Auto-logged '+n+' daily item'+(n===1?'':'s'));
}
function importSheet(){
  const file=h('input',{type:'file',accept:'.json,application/json',style:'display:none',
    onchange:async e=>{
      const f=e.target.files[0];
      if(!f)return;
      try{
        const data=JSON.parse(await f.text());
        const n=(data.entries||[]).length;
        if(!await ask('Replace all data?','This backup holds '+n+' diary entries and '+
          (data.foods||[]).length+' foods. Your current data will be overwritten.','Import',true))return;
        const res=await applyImport(data);
        close();switchTab(S.tab);
        toast('Imported '+res.entries+' entries ✓'+
          (res.skipped?' · '+res.skipped+' unreadable record'+(res.skipped===1?'':'s')+' skipped':''),
          {pr:true,dur:res.skipped?4000:2400});
      }catch(err){toast('Import failed: '+err.message,{dur:4000});}
    }});
  const body=h('div',{},
    h('p',{class:'small dim',style:'margin:0 2px 12px'},
      'Restores a MacroLog JSON backup — replaces everything currently on this device.'),
    h('button',{class:'btn primary',onclick:()=>file.click()},'Choose backup file'),file);
  const close=sheet('Import backup',body);
}
async function wipeAll(){
  if(!await ask('Erase everything','All diary entries, foods, meals and settings on this device will be deleted.','Erase',true))return;
  if(!await ask('Really erase?','Last chance — there is no undo. Export a backup first?','Erase it all',true))return;
  await Promise.all([dbClear('foods'),dbClear('entries'),dbClear('meals'),dbClear('body'),dbClear('kv')]);
  location.reload();
}

/* ---------------- theme ---------------- */
function applyTheme(){
  const light=S.set.theme==='light';
  document.body.classList.toggle('light',light);
  const[a,a2,la]=ACCENTS[S.set.accent]||ACCENTS.bronze;
  const acc=light?la:a,acc2=light?a:a2;
  document.body.style.setProperty('--acc',acc);
  document.body.style.setProperty('--acc2',acc2);
  document.body.style.setProperty('--acc-dim',acc+'26');
  $('meta[name="theme-color"]').setAttribute('content',light?'#ECEAE3':'#0B0B0D');
  fxColor();
  destroyCharts();               // charts re-pick palette on next render
  if(S.tab==='progress')renderProgress();
}

/* ---------------- load & boot ---------------- */
async function loadAll(){
  const[foods,entries,meals,body,set,notes]=await Promise.all([
    allOf('foods'),allOf('entries'),allOf('meals'),allOf('body'),
    kvGet('settings'),kvGet('notes')]);
  S.foods=new Map(foods.map(f=>[f.id,derivePer({...FOOD_DEF,...f})]));
  S.entries=entries;S.meals=meals;S.body=body;
  S.notes=notes||{};
  const inc=set||{};
  S.set={...DEF,...inc,t:{...DEF.t,...(inc.t||{})},prof:{...DEF.prof,...(inc.prof||{})}};
  applyMeals();
  reindex();
  // seed backfill + refresh: hidden/edited seed records persist as
  // tombstones (presence check can never resurrect a deleted staple), and
  // code OWNS the nutrition of unedited seeds — so model upgrades (e.g. the
  // v2 micronutrient fields) propagate into stored copies on next boot.
  for(const sf of SEED_FOODS){
    const ex=S.foods.get(sf.id);
    if(!ex){
      const c={...sf,ts:Date.now()};
      S.foods.set(c.id,c);
      await dbPut('foods',c);
    }else if(!ex.edited){
      const upd={...ex,name:sf.name,per:sf.per,p100:sf.p100,
        servLabel:sf.servLabel,servG:sf.servG,adds:sf.adds};
      if(JSON.stringify(upd)!==JSON.stringify(ex)){
        S.foods.set(sf.id,upd);
        await dbPut('foods',upd);
      }
    }
  }
}
/* cache hygiene (v2.3): every network search caches its results into the
   foods store for offline reuse — left alone that grows without bound and
   every full-library scan (search, recents, matcher) slows with it. Cached
   records the user never logged, edited, hid or referenced anywhere fade
   out after 60 days; re-searching or re-scanning simply re-caches them.
   Anything referenced by a diary entry, meal or auto-log rule is kept
   forever (entries reference foods by id — history must never break). */
async function pruneFoodCache(){
  const used=new Set();
  for(const e of S.entries)used.add(e.foodId);
  for(const m of S.meals)for(const it of m.items||[])used.add(it.foodId);
  for(const r of S.set.autoLog||[])used.add(r.foodId);
  const cutoff=Date.now()-60*86400000;
  let n=0;
  for(const f of [...S.foods.values()]){
    if(f.src!=='off'&&f.src!=='fdc')continue;
    if(f.hidden||f.edited||f.used||f.lastUsed||used.has(f.id))continue;
    if((f.ts||0)>cutoff)continue;
    S.foods.delete(f.id);
    await dbDel('foods',f.id);
    n++;
  }
  return n;
}
const HAPTIC_SW=(()=>{  // iOS ≥18: clicking a hidden switch-checkbox fires a system haptic
  const el=document.createElement('input');
  el.type='checkbox';el.setAttribute('switch','');el.style.display='none';
  return el;
})();
async function boot(){
  document.body.append(HAPTIC_SW);
  await openDB();
  // ask to be exempt from browser storage eviction before anything else touches
  // the data — see ensurePersistence() for why this matters
  ensurePersistence();
  await loadAll();
  await pruneFoodCache();
  BK.last=(await kvGet('lastBackupAt'))||null;   // primes the backup nag
  BK.snooze=(await kvGet('backupSnooze'))||0;
  applyTheme();
  buildNav();
  S.date=todayStr();
  await applyAutoLog();
  addEventListener('online',()=>netSet(false));
  addEventListener('offline',()=>netSet(true));
  netSet(!navigator.onLine);
  $('#scan-cancel').addEventListener('click',closeScanner);
  $('#scan-torch').addEventListener('click',toggleTorch);
  $('#scan-manual').addEventListener('click',()=>{
    closeScanner();
    manualBarcodeSheet('Type the digits printed under the barcode:');
  });
  $('#main').addEventListener('scroll',()=>closeOpenRow(),{passive:true});
  // iOS keyboard healing: centre focused inputs inside the internal
  // scroller; snap the window back when focus leaves (keyboard can leave
  // the page panned after dismissal)
  document.addEventListener('focusin',e=>{
    if(e.target.matches&&e.target.matches('input,textarea,select'))
      setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'});}catch(err){}},300);
  });
  addEventListener('focusout',()=>setTimeout(()=>{
    const a=document.activeElement;
    if(!a||!(a.matches&&a.matches('input,textarea,select')))window.scrollTo(0,0);
  },60));
  // iOS-standalone shell healer (IronLog field fix, iPhone 17/iOS 26):
  // layout viewport AND visualViewport can both report short by status-bar +
  // home-indicator while the canvas is fullscreen; only screen.* is honest.
  // Grow-only, capped, with explicit home-indicator clearance (body.vfix).
  function fixShell(){
    const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
    let target=window.visualViewport?Math.round(visualViewport.height):0;
    /* The screen.* override exists ONLY because iOS standalone lies about
       the viewport height. Android does not have that bug, and its
       screen.height INCLUDES the system navigation bar — applying the same
       healer there stretches the shell and pushes the nav bar off-screen.
       So: iOS keeps the proven behaviour, everything else trusts
       visualViewport (which is honest on Android). */
    if(standalone&&IS_IOS){
      const portrait=matchMedia('(orientation: portrait)').matches;
      const sh=portrait?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
      if(sh>target)target=sh;
    }
    if(!target)return;
    const cur=Math.round(document.body.getBoundingClientRect().height);
    const grow=target-cur;
    if(grow>2&&grow<=140){
      document.documentElement.style.height=target+'px';
      document.body.style.height=target+'px';
      document.body.classList.add('vfix');
    }
  }
  fixShell();
  if(window.visualViewport)visualViewport.addEventListener('resize',fixShell);
  addEventListener('pageshow',fixShell);
  addEventListener('orientationchange',()=>{
    document.documentElement.style.height='';
    document.body.style.height='';
    document.body.classList.remove('vfix');
    setTimeout(fixShell,350);
  });
  // midnight rollover: Today must flip to the new date without a relaunch
  let lastDay=todayStr();
  setInterval(()=>{
    fixShell();
    if(todayStr()!==lastDay){
      lastDay=todayStr();
      applyAutoLog().then(()=>{if(S.tab==='today'||S.tab==='diary')renderTab(S.tab);}).catch(()=>{});
      if(S.tab==='today')switchTab('today');
    }
  },1000);
  if('serviceWorker' in navigator&&window.isSecureContext)
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  // debug/test handle (same pattern as IronLog's __il)
  window.__ml={S,buildExportData,applyImport,loadAll,renderTab,switchTab,
    dayTotals,entryMacros,offToFood,streaks,reindex,dbPut,dbClear,
    suggestTargets,mifflin,matchFood,addScore,addInfo,dayAdditiveStats,
    daySummarySheet,applyAutoLog,logEntry,
    searchRank,netSearch,fdcSearch,fdcToFood,mealRecents,mealFrequents,
    macroMet,starDay,fxBurst,pruneFoodCache,targetFor,
    foodWarnings,tweakFoodSheet,validEAN,FX,IS_IOS,renderProgress,
    additiveSheet,addRowEl,ADD_WHY,foodGrade,estimateNS,
    microDefault,microRDA,SPLITS,MICRO_AGE,
    ensurePersistence,storageReport,STORE_ST,fmtBytes,
    backupNagDue,backupNagCard,backupDueDays,nagRefresh,BK,noteBackup,
    canShareBackup,downloadExport,APP_VER};
  if(!S.set.onboard)obStart();
  else switchTab('today');
}
boot().catch(err=>{
  console.error(err);
  document.body.insertAdjacentHTML('beforeend',
    '<div style="padding:90px 24px;text-align:center;color:#ff5c5c;font-size:15px">MacroLog failed to start: '+
    err.message+'<br><br>IndexedDB must be available (serve over http:// or https://).</div>');
});
